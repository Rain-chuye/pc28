<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, sans-serif; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto space-y-6">
        <header class="flex items-center gap-4">
            <button onclick="history.back()" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-slate-400 border border-slate-200"><i class="fas fa-chevron-left text-xs"></i></button>
            <h1 class="font-black text-lg">充值中心</h1>
        </header>

        <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-4">充值分值</p>
            <div class="flex items-center gap-4 border-b border-slate-100 pb-4 focus-within:border-blue-600 transition-colors">
                <span class="text-3xl font-black text-blue-600">¥</span>
                <input type="number" id="amount" class="w-full bg-transparent text-3xl font-black outline-none" placeholder="0">
            </div>
            <div class="grid grid-cols-4 gap-3 mt-6">
                <button onclick="set(100)" class="py-3 bg-slate-50 rounded-xl text-[11px] font-black border border-slate-100 active:bg-blue-50">100</button>
                <button onclick="set(500)" class="py-3 bg-slate-50 rounded-xl text-[11px] font-black border border-slate-100 active:bg-blue-50">500</button>
                <button onclick="set(1000)" class="py-3 bg-slate-50 rounded-xl text-[11px] font-black border border-slate-100 active:bg-blue-50">1000</button>
                <button onclick="set(5000)" class="py-3 bg-slate-50 rounded-xl text-[11px] font-black border border-slate-100 active:bg-blue-50">5000</button>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center">
            <img src="/assets/qr_placeholder.png" class="w-48 h-48 mx-auto opacity-40 mb-6 grayscale">
            <p class="text-xs font-bold text-slate-400">请扫码转账后点击下方提交申请</p>
        </div>

        <button onclick="submit()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black shadow-lg shadow-blue-200 active:scale-95 transition-all">
            提交充值申请
        </button>
    </div>
    <script>
        function set(v) { document.getElementById('amount').value = v; }
        async function submit() {
            const a = document.getElementById('amount').value;
            if(!a || a < 10) return alert('最小 10');
            const fd = new FormData(); fd.append('amount', a);
            const r = await fetch('/api/finance.php?action=deposit', { method: 'POST', body: fd }).then(r => r.json());
            alert(r.message); if(r.success) location.href = '/';
        }
    </script>
</body>
</html>
