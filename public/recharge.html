<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #f8fafc; font-family: -apple-system, sans-serif; }</style>
</head>
<body class="p-6 pb-20">
    <div class="max-w-md mx-auto space-y-6">
        <header class="flex items-center gap-4">
            <button onclick="history.back()" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-slate-400 border border-slate-200"><i class="fas fa-chevron-left text-xs"></i></button>
            <h1 class="font-black text-lg">充值中心</h1>
        </header>

        <!-- Bonus Banner -->
        <div class="bg-indigo-600 rounded-3xl p-6 text-white shadow-xl shadow-indigo-100">
            <p class="text-[10px] font-black uppercase opacity-60 mb-3 tracking-widest">限时充值赠送福利</p>
            <div class="space-y-2">
                <div class="flex justify-between items-center bg-white/10 p-3 rounded-xl border border-white/10">
                    <span class="text-xs font-bold">新人首充 20 元</span>
                    <span class="text-sm font-black text-yellow-300">+21 元</span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-[10px] font-bold">
                    <div class="bg-white/5 p-2 rounded-lg border border-white/5 flex justify-between"><span>10 送 1</span><span class="text-yellow-200">+1</span></div>
                    <div class="bg-white/5 p-2 rounded-lg border border-white/5 flex justify-between"><span>20 送 4</span><span class="text-yellow-200">+4</span></div>
                    <div class="bg-white/5 p-2 rounded-lg border border-white/5 flex justify-between"><span>30 送 10</span><span class="text-yellow-200">+10</span></div>
                    <div class="bg-white/5 p-2 rounded-lg border border-white/5 flex justify-between"><span>50 送 20</span><span class="text-yellow-200">+20</span></div>
                    <div class="bg-white/5 p-2 rounded-lg border border-white/5 flex justify-between col-span-2"><span>100 送 60</span><span class="text-yellow-300">+60 (巨惠)</span></div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-4">充值分值金额</p>
            <div class="flex items-center gap-4 border-b border-slate-100 pb-4 focus-within:border-indigo-600 transition-colors">
                <span class="text-3xl font-black text-indigo-600">¥</span>
                <input type="number" id="amount" class="w-full bg-transparent text-3xl font-black outline-none" placeholder="0">
            </div>
            <div class="grid grid-cols-4 gap-3 mt-6">
                <button onclick="set(20)" class="py-3 bg-slate-50 rounded-xl text-[11px] font-black border border-slate-100 active:bg-indigo-50">20</button>
                <button onclick="set(50)" class="py-3 bg-slate-50 rounded-xl text-[11px] font-black border border-slate-100 active:bg-indigo-50">50</button>
                <button onclick="set(100)" class="py-3 bg-slate-50 rounded-xl text-[11px] font-black border border-slate-100 active:bg-indigo-50">100</button>
                <button onclick="set(500)" class="py-3 bg-slate-50 rounded-xl text-[11px] font-black border border-slate-100 active:bg-indigo-50">500</button>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center">
            <div class="bg-slate-50 rounded-2xl p-4 mb-4 text-left border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-2">充值流程</p>
                <p class="text-xs font-bold text-slate-600 leading-relaxed">1. 打开加拿大投注页面联系客服<br>2. 发送支付宝口令红包<br>3. 在此页面输入对应的充值金额<br>4. 点击提交，等待后台核销上分</p>
            </div>
            <button onclick="toggleChat()" class="text-indigo-600 font-black text-xs hover:underline"><i class="fas fa-headset mr-1"></i> 联系在线客服上分</button>
        </div>

        <button onclick="submit()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black shadow-xl shadow-indigo-100 active:scale-95 transition-all">
            确认并提交充值申请
        </button>
    </div>

    <!-- Simple Chat Trigger for Recharge -->
    <script>
        function set(v) { document.getElementById('amount').value = v; }
        async function submit() {
            const a = document.getElementById('amount').value;
            if(!a || a < 10) return alert('最小充值金额为 10 元');
            const fd = new FormData(); fd.append('amount', a);
            const r = await fetch('/api/finance.php?action=deposit', { method: 'POST', body: fd }).then(r => r.json());
            if(r.success) {
                alert('充值申请已提交，请确保已发送口令红包给客服。');
                location.href = '/';
            } else alert(r.message);
        }
        function toggleChat() { location.href = '/game.html?open_chat=1'; }
    </script>
</body>
</html>
