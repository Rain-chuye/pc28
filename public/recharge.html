<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值中心 - 加拿大 28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#D4AF37',
                        gold: { DEFAULT: '#D4AF37' },
                        dark: { DEFAULT: '#121212', light: '#1E1E1E' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        body { font-family: 'Noto+Sans+SC', sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #F9E79F 0%, #D4AF37 50%, #9A7D0A 100%); }
    </style>
</head>
<body class="bg-dark text-white p-6">
    <div class="max-w-md mx-auto space-y-8">
        <header class="flex items-center justify-between">
            <button onclick="history.back()" class="w-12 h-12 rounded-2xl bg-dark-light border border-white/10 flex items-center justify-center shadow-xl"><i class="fas fa-chevron-left text-xs"></i></button>
            <h1 class="text-sm font-black uppercase tracking-[0.3em]">充值中心</h1>
            <div class="w-12"></div>
        </header>

        <div class="bg-dark-light rounded-[2.5rem] p-8 border border-white/10 shadow-2xl">
            <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">充值金额 (首充送福利)</p>
            <div class="flex items-center gap-4 border-b border-white/10 pb-4 focus-within:border-primary transition-colors">
                <span class="text-3xl font-black text-primary">¥</span>
                <input type="number" id="amount" class="w-full bg-transparent text-3xl font-black outline-none" placeholder="0.00">
            </div>

            <div class="grid grid-cols-4 gap-3 mt-8">
                <button onclick="setAmount(100)" class="py-3 bg-dark rounded-xl text-xs font-black border border-white/5 active:border-primary">100</button>
                <button onclick="setAmount(500)" class="py-3 bg-dark rounded-xl text-xs font-black border border-white/5 active:border-primary">500</button>
                <button onclick="setAmount(1000)" class="py-3 bg-dark rounded-xl text-xs font-black border border-white/5 active:border-primary">1000</button>
                <button onclick="setAmount(5000)" class="py-3 bg-dark rounded-xl text-xs font-black border border-white/5 active:border-primary">5000</button>
            </div>
        </div>

        <div class="bg-dark-light rounded-[2.5rem] p-8 border border-white/10 shadow-2xl text-center space-y-6">
            <p class="text-xs font-black text-slate-500 uppercase tracking-widest">支付渠道</p>
            <div class="bg-dark p-6 rounded-3xl border border-white/5 inline-block">
                <img src="/assets/qr_placeholder.png" alt="QR" class="w-48 h-48 opacity-80 grayscale contrast-125">
            </div>
            <div class="space-y-2">
                <p class="text-xs font-bold text-primary">官方指定支付通道</p>
                <p class="text-[10px] text-slate-600 font-bold leading-relaxed">请转账成功后，务必截图并点击下方提交按钮。<br>财务人员将在 1-5 分钟内完成入账。</p>
            </div>
        </div>

        <button onclick="submit()" class="w-full gold-gradient text-black py-5 rounded-2xl font-black shadow-lg shadow-primary/20 active:scale-95 transition-all">
            提交充值申请
        </button>
    </div>

    <script>
        function setAmount(a) { document.getElementById('amount').value = a; }
        async function submit() {
            const amount = document.getElementById('amount').value;
            if(!amount || amount < 10) return alert('最小充值金额为 10 元');
            const fd = new FormData();
            fd.append('amount', amount);
            const res = await fetch('/api/finance.php?action=deposit', { method: 'POST', body: fd });
            const data = await res.json();
            alert(data.message);
            if(data.success) location.href = '/';
        }
    </script>
</body>
</html>
