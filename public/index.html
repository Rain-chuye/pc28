<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加拿大 28 - 游戏大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#D4AF37', // Gold
                        gold: {
                            light: '#F9E79F',
                            DEFAULT: '#D4AF37',
                            dark: '#9A7D0A'
                        },
                        dark: {
                            DEFAULT: '#121212',
                            light: '#1E1E1E'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        body { font-family: 'Noto+Sans+SC', sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #F9E79F 0%, #D4AF37 50%, #9A7D0A 100%); }
        .gold-border { border: 1px solid transparent; background-image: linear-gradient(#121212, #121212), linear-gradient(135deg, #F9E79F, #D4AF37); background-origin: border-box; background-clip: content-box, border-box; }
        .room-card { transition: all 0.3s ease; }
        .room-card:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-dark text-white min-h-screen">
    <!-- Header -->
    <header class="p-6 flex justify-between items-center bg-dark-light/50 backdrop-blur-lg sticky top-0 z-50 border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center text-black font-black">28</div>
            <h1 class="text-xl font-black tracking-tighter">CANADA<span class="text-primary">28</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-dark-light px-4 py-2 rounded-full border border-white/10 flex items-center gap-2">
                <i class="fas fa-wallet text-primary text-xs"></i>
                <span id="user-balance" class="text-xs font-bold">¥ 0.00</span>
            </div>
            <a href="/profile.html" class="w-10 h-10 bg-dark-light rounded-full flex items-center justify-center border border-white/10">
                <i class="fas fa-user text-slate-400"></i>
            </a>
        </div>
    </header>

    <main class="p-6 space-y-8 pb-32">
        <!-- Banner -->
        <div class="relative overflow-hidden rounded-[2rem] p-8 gold-gradient text-black">
            <div class="relative z-10">
                <h2 class="text-2xl font-black mb-2">欢迎来到至尊大厅</h2>
                <p class="text-sm font-medium opacity-70">公平公正 · 极速派奖 · 奢华体验</p>
                <div class="mt-6 inline-flex items-center gap-2 bg-black text-white px-4 py-2 rounded-full text-xs font-black">
                    <i class="fas fa-shield-alt text-primary"></i> 官方认证平台
                </div>
            </div>
            <i class="fas fa-crown absolute -right-4 -bottom-4 text-9xl opacity-10 rotate-12"></i>
        </div>

        <!-- Room Selection -->
        <div class="space-y-4">
            <h3 class="text-sm font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">
                <div class="w-1 h-3 gold-gradient rounded-full"></div> 选择游戏房间
            </h3>

            <!-- Room: Low Odds -->
            <div onclick="enterRoom('low')" class="room-card bg-dark-light p-6 rounded-[2rem] border border-white/5 flex items-center gap-6 relative overflow-hidden group">
                <div class="w-16 h-16 rounded-2xl gold-gradient flex items-center justify-center text-black text-2xl shadow-xl">
                    <i class="fas fa-bolt"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-lg font-black mb-1 group-hover:text-primary transition-colors">标准房 (低赔率)</h4>
                    <p class="text-xs text-slate-500">经典玩法，最高 2.0 倍赔率</p>
                    <div class="mt-3 flex gap-2">
                        <span class="bg-primary/10 text-primary text-[10px] px-2 py-1 rounded-md font-bold">高返奖</span>
                        <span class="bg-slate-800 text-slate-400 text-[10px] px-2 py-1 rounded-md font-bold">人气火爆</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-slate-700"></i>
            </div>

            <!-- Room: High Odds -->
            <div onclick="enterRoom('high')" class="room-card bg-dark-light p-6 rounded-[2rem] border border-white/5 flex items-center gap-6 relative overflow-hidden group">
                <div class="w-16 h-16 rounded-2xl bg-slate-800 border border-primary/30 flex items-center justify-center text-primary text-2xl">
                    <i class="fas fa-gem"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-lg font-black mb-1 group-hover:text-primary transition-colors">至尊房 (高赔率)</h4>
                    <p class="text-xs text-slate-500">保本规则，极致安全体验</p>
                    <div class="mt-3 flex gap-2">
                        <span class="bg-primary/10 text-primary text-[10px] px-2 py-1 rounded-md font-bold">回本保障</span>
                        <span class="bg-slate-800 text-slate-400 text-[10px] px-2 py-1 rounded-md font-bold">VIP 专享</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-slate-700"></i>
            </div>
        </div>

        <!-- Latest Results Preview -->
        <div class="bg-dark-light/30 rounded-[2rem] p-6 border border-white/5">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest">近期开奖</h3>
                <span class="text-[10px] text-primary font-bold">更多记录 <i class="fas fa-arrow-right ml-1"></i></span>
            </div>
            <div id="latest-results" class="space-y-3">
                <!-- Result items -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 p-4 bg-dark/80 backdrop-blur-xl border-t border-white/5 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="/" class="flex flex-col items-center gap-1 text-primary">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px] font-bold">大厅</span>
            </a>
            <a href="/recharge.html" class="flex flex-col items-center gap-1 text-slate-500">
                <i class="fas fa-plus-circle text-lg"></i>
                <span class="text-[10px] font-bold">充值</span>
            </a>
            <a href="/withdraw.html" class="flex flex-col items-center gap-1 text-slate-500">
                <i class="fas fa-university text-lg"></i>
                <span class="text-[10px] font-bold">提现</span>
            </a>
            <a href="/profile.html" class="flex flex-col items-center gap-1 text-slate-500">
                <i class="fas fa-user text-lg"></i>
                <span class="text-[10px] font-bold">我的</span>
            </a>
        </div>
    </nav>

    <script>
        function enterRoom(mode) {
            location.href = `/game.html?room=${mode}`;
        }

        async function refreshInfo() {
            try {
                const uRes = await fetch('/api/user_info.php');
                const uData = await uRes.json();
                if(uData.success) {
                    document.getElementById('user-balance').innerText = '¥ ' + parseFloat(uData.user.balance).toLocaleString();
                }

                const lRes = await fetch('/api/lottery.php?limit=5');
                const lData = await lRes.json();
                if(lData.history) {
                    document.getElementById('latest-results').innerHTML = lData.history.map(item => `
                        <div class="flex justify-between items-center py-2 border-b border-white/5 last:border-0">
                            <span class="text-xs text-slate-500 font-bold">${item.issue_no} 期</span>
                            <div class="flex items-center gap-4">
                                <div class="flex gap-1">
                                    ${item.numbers.split(',').map(n => `<span class="text-xs font-black w-5 h-5 flex items-center justify-center bg-slate-800 rounded-md">${n}</span>`).join('')}
                                </div>
                                <span class="text-sm font-black text-primary">${item.total_sum}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) {}
        }

        refreshInfo();
        setInterval(refreshInfo, 10000);
    </script>
</body>
</html>
