<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC28 - 极简大厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#EAB308', // Simpler Yellow/Gold
                        dark: { DEFAULT: '#0A0A0A', light: '#141414', border: '#1F1F1F' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; color: #E5E5E5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .btn-hover { transition: all 0.2s; }
        .btn-hover:active { transform: scale(0.98); opacity: 0.8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="p-5 flex justify-between items-center border-b border-dark-border">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-black font-black text-xs">28</div>
            <span class="font-bold tracking-tight">CANADA 28</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-right">
                <p class="text-[9px] text-slate-500 font-medium">可用余额</p>
                <p id="user-balance" class="text-sm font-bold text-primary">¥ 0.00</p>
            </div>
            <a href="/profile.html" class="w-9 h-9 rounded-full bg-dark-light border border-dark-border flex items-center justify-center">
                <i class="fas fa-user text-slate-500 text-xs"></i>
            </a>
        </div>
    </header>

    <main class="flex-1 p-5 space-y-6">
        <!-- Room Selection -->
        <div class="grid grid-cols-1 gap-4">
            <div onclick="enterRoom('low')" class="btn-hover bg-dark-light p-6 rounded-2xl border border-dark-border flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold">标准房</h3>
                    <p class="text-xs text-slate-500 mt-1">经典 2.0 赔率 · 极速派奖</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                    <i class="fas fa-bolt"></i>
                </div>
            </div>

            <div onclick="enterRoom('high')" class="btn-hover bg-dark-light p-6 rounded-2xl border border-dark-border flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold text-primary">至尊房</h3>
                    <p class="text-xs text-slate-500 mt-1">高赔率玩法 · 专属返利</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-black">
                    <i class="fas fa-gem"></i>
                </div>
            </div>
        </div>

        <!-- Results Table -->
        <div class="bg-dark-light rounded-2xl border border-dark-border overflow-hidden">
            <div class="p-4 border-b border-dark-border flex justify-between items-center">
                <h4 class="text-xs font-bold text-slate-400">近期开奖</h4>
                <a href="/game.html" class="text-[10px] text-primary font-bold">进入房间 <i class="fas fa-arrow-right ml-1"></i></a>
            </div>
            <div id="latest-results" class="divide-y divide-dark-border">
                <!-- Rows -->
            </div>
        </div>
    </main>

    <!-- Simple Nav -->
    <nav class="p-4 bg-dark-light border-t border-dark-border flex justify-around">
        <a href="/" class="text-primary flex flex-col items-center gap-1">
            <i class="fas fa-home text-sm"></i>
            <span class="text-[9px] font-bold">大厅</span>
        </a>
        <a href="/recharge.html" class="text-slate-500 flex flex-col items-center gap-1">
            <i class="fas fa-plus-circle text-sm"></i>
            <span class="text-[9px] font-bold">充值</span>
        </a>
        <a href="/withdraw.html" class="text-slate-500 flex flex-col items-center gap-1">
            <i class="fas fa-wallet text-sm"></i>
            <span class="text-[9px] font-bold">回分</span>
        </a>
        <a href="/profile.html" class="text-slate-500 flex flex-col items-center gap-1">
            <i class="fas fa-user text-sm"></i>
            <span class="text-[9px] font-bold">我的</span>
        </a>
    </nav>

    <script>
        function enterRoom(mode) { location.href = `/game.html?room=${mode}`; }

        async function refresh() {
            try {
                const uRes = await fetch('/api/user_info.php');
                const uData = await uRes.json();
                if(uData.success) document.getElementById('user-balance').innerText = '¥ ' + parseFloat(uData.user.balance).toLocaleString();

                const lRes = await fetch('/api/lottery.php?limit=8');
                const lData = await lRes.json();
                if(lData.history) {
                    document.getElementById('latest-results').innerHTML = lData.history.map(item => `
                        <div class="flex justify-between items-center p-4">
                            <span class="text-[11px] text-slate-500 font-medium">${item.issue_no}</span>
                            <div class="flex items-center gap-3">
                                <div class="flex gap-1">
                                    ${item.numbers.split(',').map(n => `<span class="w-5 h-5 flex items-center justify-center bg-dark border border-dark-border rounded text-[10px] font-bold">${n}</span>`).join('')}
                                </div>
                                <span class="text-sm font-black text-primary w-6 text-right">${item.total_sum}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch(e) {}
        }
        refresh();
        setInterval(refresh, 10000);
    </script>
</body>
</html>
