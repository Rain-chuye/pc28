<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报表统计 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#EAB308',
                        dark: { DEFAULT: '#0A0A0A', light: '#141414', border: '#1F1F1F' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; color: #E5E5E5; font-family: -apple-system, sans-serif; }
    </style>
</head>
<body class="pb-20">
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md p-4 flex items-center justify-between border-b border-dark-border">
        <button onclick="history.back()" class="w-8 h-8 flex items-center justify-center rounded-full bg-dark-light border border-dark-border">
            <i class="fas fa-chevron-left text-xs"></i>
        </button>
        <h1 class="text-sm font-bold">报表统计</h1>
        <div class="w-8"></div>
    </header>

    <div class="p-4 grid grid-cols-2 gap-3">
        <div class="bg-dark-light p-4 rounded-2xl border border-dark-border">
            <p class="text-[10px] text-slate-500 uppercase mb-1">累计投注</p>
            <p id="total-bet" class="text-lg font-black text-slate-200">¥ 0</p>
        </div>
        <div class="bg-dark-light p-4 rounded-2xl border border-dark-border">
            <p class="text-[10px] text-slate-500 uppercase mb-1">累计盈亏</p>
            <p id="total-profit" class="text-lg font-black text-primary">¥ 0</p>
        </div>
    </div>

    <div class="px-4">
        <div class="bg-dark-light rounded-2xl border border-dark-border overflow-hidden">
            <table class="w-full text-[11px]">
                <thead class="bg-black/40 text-slate-500 font-bold border-b border-dark-border">
                    <tr>
                        <th class="py-3 px-4 text-left">日期</th>
                        <th class="py-3 px-2 text-right">注数</th>
                        <th class="py-3 px-2 text-right">投注</th>
                        <th class="py-3 px-4 text-right">盈亏</th>
                    </tr>
                </thead>
                <tbody id="stats-body" class="divide-y divide-dark-border/50">
                    <!-- Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchStats() {
            const res = await fetch('/api/user_stats.php');
            const data = await res.json();
            if (data.success) {
                const ov = data.overview;
                document.getElementById('total-bet').innerText = '¥' + Math.floor(ov.total_bet || 0);
                const profit = parseFloat(ov.total_win || 0) - parseFloat(ov.total_bet || 0);
                document.getElementById('total-profit').innerText = '¥' + Math.floor(profit);
                document.getElementById('total-profit').className = profit >= 0 ? 'text-lg font-black text-green-500' : 'text-lg font-black text-red-500';

                document.getElementById('stats-body').innerHTML = data.daily_reports.map(row => `
                    <tr>
                        <td class="py-4 px-4 font-medium text-slate-400">${row.date.substring(5)}</td>
                        <td class="py-4 px-2 text-right">${row.order_count}</td>
                        <td class="py-4 px-2 text-right">¥${Math.floor(row.bet_amount)}</td>
                        <td class="py-4 px-4 text-right font-bold ${row.profit >= 0 ? 'text-green-500' : 'text-red-500'}">
                            ${row.profit > 0 ? '+' : ''}${Math.floor(row.profit)}
                        </td>
                    </tr>
                `).join('');
            }
        }
        fetchStats();
    </script>
</body>
</html>
