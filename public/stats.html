<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报表 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, sans-serif; }
    </style>
</head>
<body class="pb-20">
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50 flex items-center gap-4">
        <button onclick="history.back()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 border border-slate-100"><i class="fas fa-chevron-left text-xs"></i></button>
        <h1 class="font-bold text-sm">财务报表统计</h1>
    </header>

    <div class="p-5 grid grid-cols-2 gap-4">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">累计下单</p>
            <p id="total-bet" class="text-lg font-black text-slate-800">¥ 0</p>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">盈亏统计</p>
            <p id="total-profit" class="text-lg font-black text-blue-600">¥ 0</p>
        </div>
    </div>

    <div class="px-5">
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <table class="w-full text-[11px]">
                <thead class="bg-slate-50 text-slate-500 font-black border-b border-slate-200">
                    <tr>
                        <th class="py-4 px-4 text-left">时间</th>
                        <th class="py-4 px-2 text-right">单数</th>
                        <th class="py-4 px-2 text-right">下单</th>
                        <th class="py-4 px-4 text-right">盈亏</th>
                    </tr>
                </thead>
                <tbody id="stats-body" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchStats() {
            const r = await fetch('/api/user_stats.php').then(r => r.json());
            if (r.success) {
                const ov = r.overview;
                document.getElementById('total-bet').innerText = '¥' + Math.floor(ov.total_bet || 0);
                const p = parseFloat(ov.total_win || 0) - parseFloat(ov.total_bet || 0);
                document.getElementById('total-profit').innerText = '¥' + Math.floor(p);
                document.getElementById('total-profit').className = p >= 0 ? 'text-lg font-black text-blue-600' : 'text-lg font-black text-red-500';
                document.getElementById('stats-body').innerHTML = r.daily_reports.map(row => `
                    <tr>
                        <td class="py-4 px-4 font-bold text-slate-500">${row.date.substring(5)}</td>
                        <td class="py-4 px-2 text-right text-slate-400">${row.order_count}</td>
                        <td class="py-4 px-2 text-right text-slate-800">¥${Math.floor(row.bet_amount)}</td>
                        <td class="py-4 px-4 text-right font-black ${row.profit >= 0 ? 'text-blue-600' : 'text-red-500'}">
                            ${row.profit > 0 ? '+' : ''}${Math.floor(row.profit)}
                        </td>
                    </tr>
                `).join('');
            }
        }
        fetchStats();
    </script>
</body>
</html>
