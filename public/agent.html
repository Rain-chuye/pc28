<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理中心 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, sans-serif; }
        .tab-btn { position: relative; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; background: #2563eb; border-radius: 10px; }
    </style>
</head>
<body class="pb-32">
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50 flex items-center gap-4">
        <button onclick="history.back()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 border border-slate-100"><i class="fas fa-chevron-left"></i></button>
        <h1 class="font-bold text-sm">代理合伙人中心</h1>
    </header>

    <main class="p-5 space-y-6">
        <!-- Stats -->
        <div class="bg-blue-600 rounded-[2rem] p-8 text-white shadow-xl shadow-blue-100 relative overflow-hidden">
            <div class="relative z-10">
                <p class="text-[10px] font-black opacity-60 uppercase mb-1">累计推广收益</p>
                <h2 class="text-4xl font-black">¥ <span id="rebate-total">0.00</span></h2>
                <div class="mt-6 flex gap-6">
                    <div>
                        <p class="text-[9px] opacity-60 font-bold">直属下级</p>
                        <p class="text-lg font-black" id="sub-count">0</p>
                    </div>
                    <div>
                        <p class="text-[9px] opacity-60 font-bold">今日收益</p>
                        <p class="text-lg font-black" id="today-rebate">0.00</p>
                    </div>
                </div>
            </div>
            <i class="fas fa-users absolute -right-6 -bottom-6 text-9xl opacity-10"></i>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex items-center gap-8 px-2 border-b border-slate-100">
            <button onclick="switchTab('invite')" id="tab-invite" class="tab-btn active text-xs font-black text-slate-800 pb-3">推广链接</button>
            <button onclick="switchTab('subs')" id="tab-subs" class="tab-btn text-xs font-black text-slate-400 pb-3">下级成员</button>
            <button onclick="switchTab('logs')" id="tab-logs" class="tab-btn text-xs font-black text-slate-400 pb-3">佣金记录</button>
        </div>

        <!-- Section: Invite -->
        <div id="section-invite" class="space-y-6">
            <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm text-center">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-6">我的专属推广码</h3>
                <div id="qrcode" class="inline-block p-4 bg-slate-50 rounded-2xl border border-slate-100 mb-6"></div>
                <div class="bg-slate-50 rounded-xl p-4 border border-slate-100 flex items-center justify-between gap-3">
                    <p class="text-[10px] font-bold text-slate-500 truncate text-left" id="share-link">加载中...</p>
                    <button onclick="copyLink()" class="bg-blue-600 text-white text-[9px] px-3 py-1.5 rounded-lg font-black shrink-0">复制</button>
                </div>
            </div>
        </div>

        <!-- Section: Subordinates -->
        <div id="section-subs" class="hidden space-y-4">
            <div id="subs-list" class="space-y-3">
                <div class="p-10 text-center text-slate-300 text-xs font-bold bg-white rounded-3xl border border-slate-100">暂无下级成员</div>
            </div>
        </div>

        <!-- Section: Logs -->
        <div id="section-logs" class="hidden">
            <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden">
                <div id="rebate-list" class="divide-y divide-slate-50">
                    <div class="p-10 text-center text-slate-300 text-xs font-bold">暂无收益记录</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let agentData = null;

        async function loadAgentData() {
            const res = await fetch('/api/agent_subordinates.php').then(r => r.json());
            const settingsRes = await fetch('/api/system_info.php?action=get_settings').then(r => r.json());

            if(res.success) {
                agentData = res.data;
                document.getElementById('rebate-total').innerText = agentData.total_rebate.toFixed(2);
                document.getElementById('today-rebate').innerText = agentData.today_rebate.toFixed(2);
                document.getElementById('sub-count').innerText = agentData.sub_count;

                // Subordinates List
                if(agentData.subordinates.length > 0) {
                    document.getElementById('subs-list').innerHTML = agentData.subordinates.map(s => `
                        <div class="bg-white p-5 rounded-3xl border border-slate-100 flex justify-between items-center">
                            <div>
                                <p class="text-xs font-black text-slate-800">${s.username}</p>
                                <p class="text-[9px] text-slate-400 font-bold">注册: ${s.created_at.split(' ')[0]}</p>
                                <div class="flex gap-3 mt-2">
                                    <span class="text-[8px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-bold">充值: ${parseFloat(s.total_deposit || 0).toFixed(0)}</span>
                                    <span class="text-[8px] bg-green-50 text-green-600 px-2 py-0.5 rounded font-bold">流水: ${parseFloat(s.total_turnover || 0).toFixed(0)}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] text-slate-400 font-bold mb-1">贡献佣金</p>
                                <p class="text-xs font-black text-blue-600">¥${parseFloat(s.total_rebate_earned || 0).toFixed(2)}</p>
                            </div>
                        </div>
                    `).join('');
                }

                // Invite Link
                if(settingsRes.success) {
                    const userRes = await fetch('/api/user_info.php').then(r => r.json());
                    const link = settingsRes.data.agent_link_prefix + userRes.user.id;
                    document.getElementById('share-link').innerText = link;

                    const qr = qrcode(4, 'L');
                    qr.addData(link);
                    qr.make();
                    document.getElementById('qrcode').innerHTML = qr.createImgTag(5);
                }

                // Rebate Logs
                const rebateRes = await fetch('/api/balance_logs.php?type=rebate&limit=50').then(r => r.json());
                if(rebateRes.success && rebateRes.data.length > 0) {
                    document.getElementById('rebate-list').innerHTML = rebateRes.data.map(i => `
                        <div class="p-4 flex justify-between items-center">
                            <div>
                                <p class="text-xs font-black text-slate-800">${i.description}</p>
                                <p class="text-[9px] text-slate-400 font-bold">${i.created_at}</p>
                            </div>
                            <span class="text-sm font-black text-green-600">+${i.amount}</span>
                        </div>
                    `).join('');
                }
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active', 'text-slate-800');
                b.classList.add('text-slate-400');
            });
            document.getElementById('tab-' + tab).classList.add('active', 'text-slate-800');
            document.getElementById('tab-' + tab).classList.remove('text-slate-400');

            ['invite', 'subs', 'logs'].forEach(t => {
                document.getElementById('section-' + t).classList.add('hidden');
            });
            document.getElementById('section-' + tab).classList.remove('hidden');
        }

        function copyLink() {
            const link = document.getElementById('share-link').innerText;
            navigator.clipboard.writeText(link).then(() => alert('推广链接已复制'));
        }

        loadAgentData();
    </script>
</body>
</html>
