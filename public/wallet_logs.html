<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分明细 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: -apple-system, sans-serif; }
        .log-item { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; margin-bottom: 0.75rem; transition: 0.2s; }
        .log-item:active { background: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50 flex items-center gap-4">
        <button onclick="history.back()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 border border-slate-100"><i class="fas fa-chevron-left"></i></button>
        <h1 class="font-bold text-sm">积分变动明细</h1>
    </header>

    <main class="p-4">
        <!-- Filters -->
        <div class="flex gap-2 overflow-x-auto pb-4 scroll-hide">
            <button onclick="filterLogs('all')" class="type-btn active bg-blue-600 text-white px-4 py-2 rounded-full text-[10px] font-bold shrink-0">全部</button>
            <button onclick="filterLogs('bet')" class="type-btn bg-white border border-slate-200 text-slate-500 px-4 py-2 rounded-full text-[10px] font-bold shrink-0">投注扣分</button>
            <button onclick="filterLogs('win')" class="type-btn bg-white border border-slate-200 text-slate-500 px-4 py-2 rounded-full text-[10px] font-bold shrink-0">中奖回分</button>
            <button onclick="filterLogs('deposit')" class="type-btn bg-white border border-slate-200 text-slate-500 px-4 py-2 rounded-full text-[10px] font-bold shrink-0">充值</button>
            <button onclick="filterLogs('withdraw')" class="type-btn bg-white border border-slate-200 text-slate-500 px-4 py-2 rounded-full text-[10px] font-bold shrink-0">回分</button>
        </div>

        <div id="log-list" class="space-y-3">
            <!-- Items -->
            <div class="p-20 text-center text-slate-300 font-bold text-xs">正在拉取云端账单...</div>
        </div>
    </main>

    <script>
        let currentType = 'all';
        const typeMap = {
            'bet': { label: '投注扣分', color: 'text-slate-500', bg: 'bg-slate-50' },
            'win': { label: '中奖派彩', color: 'text-blue-600', bg: 'bg-blue-50' },
            'deposit': { label: '充值入账', color: 'text-green-600', bg: 'bg-green-50' },
            'withdraw': { label: '回分申请', color: 'text-orange-600', bg: 'bg-orange-50' },
            'bonus': { label: '福利赠送', color: 'text-purple-600', bg: 'bg-purple-50' },
            'rebate': { label: '流水返点', color: 'text-indigo-600', bg: 'bg-indigo-50' }
        };

        function filterLogs(t) {
            currentType = t;
            document.querySelectorAll('.type-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white');
                b.classList.add('bg-white', 'border-slate-200', 'text-slate-500');
            });
            event.target.classList.remove('bg-white', 'border-slate-200', 'text-slate-500');
            event.target.classList.add('bg-blue-600', 'text-white');
            loadLogs();
        }

        async function loadLogs() {
            try {
                const res = await fetch(`/api/balance_logs.php?type=${currentType}&limit=50`).then(r => r.json());
                const list = document.getElementById('log-list');
                if(!res.success || res.data.length === 0) {
                    list.innerHTML = '<div class="p-20 text-center text-slate-300 font-black text-sm">无账变记录</div>';
                    return;
                }
                list.innerHTML = res.data.map(log => {
                    const cfg = typeMap[log.type] || { label: '其他变动', color: 'text-slate-400', bg: 'bg-slate-50' };
                    return `
                        <div class="log-item p-5 flex justify-between items-center">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-2xl ${cfg.bg} flex items-center justify-center ${cfg.color} text-xs font-black">
                                    <i class="fas fa-receipt"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-black text-slate-800 mb-1">${log.description || cfg.label}</p>
                                    <p class="text-[10px] text-slate-400 font-bold">${log.created_at}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-black ${log.amount > 0 ? 'text-blue-600' : 'text-slate-800'}">${log.amount > 0 ? '+' : ''}${log.amount}</p>
                                <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">余: ${parseFloat(log.balance_after).toFixed(2)}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) {
                document.getElementById('log-list').innerHTML = '<div class="p-20 text-center text-red-400 font-bold">云端账单连接超时</div>';
            }
        }
        loadLogs();
    </script>
</body>
</html>
