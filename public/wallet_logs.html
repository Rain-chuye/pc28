<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账单明细 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, sans-serif; }
        .log-card { background: white; border-radius: 1.25rem; padding: 1.25rem; border: 1px solid #f1f5f9; }
    </style>
</head>
<body class="p-6">
    <header class="flex items-center gap-4 mb-8">
        <button onclick="history.back()" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-slate-400 shadow-sm"><i class="fas fa-chevron-left text-xs"></i></button>
        <h1 class="text-xl font-black text-slate-800">账单明细</h1>
    </header>

    <div class="flex bg-white p-1 rounded-xl mb-6 shadow-sm border border-slate-100">
        <button onclick="switchTab('balance')" id="tab-balance" class="flex-1 py-2.5 rounded-lg font-black text-[10px] uppercase bg-blue-600 text-white shadow-lg">资金变动</button>
        <button onclick="switchTab('bet')" id="tab-bet" class="flex-1 py-2.5 rounded-lg font-black text-[10px] uppercase text-slate-400">投注记录</button>
    </div>

    <div id="log-container" class="space-y-4">
        <div class="p-10 text-center text-slate-300 font-bold text-xs">正在载入账单...</div>
    </div>

    <script>
        let currentTab = new URLSearchParams(window.location.search).get('type') || 'balance';

        function switchTab(t) {
            currentTab = t;
            document.getElementById('tab-balance').className = t === 'balance' ? 'flex-1 py-2.5 rounded-lg font-black text-[10px] uppercase bg-blue-600 text-white shadow-lg' : 'flex-1 py-2.5 rounded-lg font-black text-[10px] uppercase text-slate-400';
            document.getElementById('tab-bet').className = t === 'bet' ? 'flex-1 py-2.5 rounded-lg font-black text-[10px] uppercase bg-blue-600 text-white shadow-lg' : 'flex-1 py-2.5 rounded-lg font-black text-[10px] uppercase text-slate-400';
            loadLogs();
        }

        async function loadLogs() {
            const endpoint = currentTab === 'balance' ? '/api/balance_logs.php' : '/api/bet_history.php';
            const res = await fetch(endpoint).then(r => r.json());
            const container = document.getElementById('log-container');

            if(res.success && res.data.length > 0) {
                if(currentTab === 'balance') {
                    container.innerHTML = res.data.map(l => `
                        <div class="log-card flex justify-between items-center">
                            <div>
                                <p class="text-xs font-black text-slate-800">${l.description || '资金变动'}</p>
                                <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase">${l.created_at}</p>
                            </div>
                            <p class="text-sm font-black ${l.amount > 0 ? 'text-emerald-500' : 'text-slate-800'}">${l.amount > 0 ? '+' : ''}${parseFloat(l.amount).toLocaleString()}</p>
                        </div>
                    `).join('');
                } else {
                    const map = {'big':'大','small':'小','single':'单','double':'双','big_single':'大单','big_double':'大双','small_single':'小单','small_double':'小双','triple':'豹子','straight':'顺子','pair':'对子'};
                    container.innerHTML = res.data.map(b => `
                        <div class="log-card flex justify-between items-center">
                            <div>
                                <p class="text-xs font-black text-slate-800">期号 #${b.issue_no} [${map[b.play_type] || b.play_type}]</p>
                                <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase">${b.created_at} | ${b.odds_type === 'high' ? '高倍' : '标准'}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[9px] font-black text-slate-300 uppercase">投注: ${b.bet_amount}</p>
                                <p class="text-xs font-black ${b.status == 1 ? 'text-blue-600' : (b.status == 2 ? 'text-slate-300' : 'text-emerald-500')}">${b.status == 1 ? '赢 ' + b.win_amount : (b.status == 2 ? '未中奖' : '已退本')}</p>
                            </div>
                        </div>
                    `).join('');
                }
            } else {
                container.innerHTML = `<div class="p-10 text-center text-slate-300 font-bold text-xs">暂无记录</div>`;
            }
        }

        switchTab(currentTab);
    </script>
</body>
</html>
