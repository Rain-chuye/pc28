<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提现申请</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-md mx-auto">
        <header class="flex items-center gap-4 mb-8">
            <button onclick="history.back()" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center"><i class="fas fa-arrow-left"></i></button>
            <h1 class="text-xl font-bold">提现中心</h1>
        </header>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-8">
            <p class="text-xs text-slate-400 mb-2">提现金额</p>
            <div class="flex items-center gap-2 border-b-2 border-slate-100 pb-2 focus-within:border-indigo-500 transition-colors">
                <span class="text-2xl font-bold">¥</span>
                <input type="number" id="amount" class="w-full text-2xl font-bold outline-none" placeholder="0.00">
            </div>
            <p class="text-[10px] text-slate-300 mt-4">提现需经管理员手动审核，请确保您的提现地址已在个人资料中配置。</p>
        </div>

        <button onclick="submit()" class="w-full bg-slate-900 text-white py-4 rounded-full font-bold shadow-lg shadow-slate-200">提交提现申请</button>
    </div>

    <script>
        async function submit() {
            const amount = document.getElementById('amount').value;
            if(!amount) return alert('请输入金额');
            const fd = new FormData();
            fd.append('amount', amount);
            const res = await fetch('/api/withdraw.php', { method: 'POST', body: fd });
            const data = await res.json();
            alert(data.message);
            if(data.success) location.href = '/game.html';
        }
    </script>
</body>
</html>
