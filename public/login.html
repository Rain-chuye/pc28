<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 加拿大 28</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-md bg-white rounded-[2.5rem] p-10 shadow-2xl shadow-indigo-100">
        <h1 class="text-3xl font-black text-indigo-600 mb-2">欢迎回来</h1>
        <p class="text-slate-400 text-sm mb-10">登录您的账户开启红单之旅</p>

        <div class="space-y-6">
            <div>
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">用户名</label>
                <input type="text" id="username" class="w-full bg-slate-50 rounded-2xl px-6 py-4 outline-none focus:ring-2 ring-indigo-500/20 transition-all" placeholder="输入用户名">
            </div>
            <div>
                <label class="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">密码</label>
                <input type="password" id="password" class="w-full bg-slate-50 rounded-2xl px-6 py-4 outline-none focus:ring-2 ring-indigo-500/20 transition-all" placeholder="输入密码">
            </div>
            <button onclick="login()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black shadow-lg shadow-indigo-200 active:scale-95 transition-all">立即登录</button>
        </div>

        <p class="mt-10 text-center text-sm text-slate-400">还没有账号？ <a href="/register.html" class="text-indigo-600 font-bold">立即注册</a></p>
    </div>

    <script>
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/login.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if(data.success) location.href = '/game.html';
            else alert(data.message);
        }
    </script>
</body>
</html>
