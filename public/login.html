<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #fff; font-family: -apple-system, sans-serif; }
        .login-card { min-height: 100vh; display: flex; flex-direction: column; padding: 2rem; justify-content: center; }
        .input-group { border-bottom: 2px solid #f1f5f9; padding: 1rem 0; margin-bottom: 1rem; transition: border-color 0.3s; }
        .input-group:focus-within { border-color: #2563eb; }
        .input-field { width: 100%; border: none; outline: none; font-weight: 800; font-size: 1rem; color: #1e293b; padding: 0.5rem 0; }
        .btn-login { width: 100%; background: #2563eb; color: white; padding: 1.25rem; border-radius: 1.5rem; font-weight: 900; margin-top: 2rem; box-shadow: 0 10px 20px -5px rgba(37,99,235,0.3); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="mb-12">
            <div class="w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center text-white text-2xl font-black italic mb-6">DY</div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tighter">欢迎回来</h1>
            <p class="text-slate-400 font-bold text-sm mt-2">请登录您的 东爷国际 账号</p>
        </div>

        <div class="space-y-4">
            <div class="input-group">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">账号</p>
                <input type="text" id="username" class="input-field" placeholder="请输入您的用户名">
            </div>
            <div class="input-group">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">密码</p>
                <input type="password" id="password" class="input-field" placeholder="请输入您的登录密码">
            </div>
        </div>

        <button onclick="login()" class="btn-login">立即登录</button>

        <div class="mt-8 flex justify-between items-center text-xs font-black uppercase tracking-tighter">
            <a href="/register.html" class="text-blue-600">注册新账号</a>
            <a href="/forgot_password.html" class="text-slate-400">忘记密码？</a>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if(!username || !password) return alert('请填写完整');

            const res = await fetch('/api/login.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            }).then(r => r.json());

            if(res.success) {
                sessionStorage.removeItem('announce_shown');
                location.href = '/';
            } else alert(res.message);
        }
    </script>
</body>
</html>
