<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, sans-serif; }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl opacity-0 transition-opacity pointer-events-none z-50"></div>

    <div class="w-full max-w-sm bg-white rounded-[2.5rem] p-10 border border-slate-200 shadow-xl shadow-slate-100">
        <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-xl font-black mb-8 shadow-lg shadow-blue-100 mx-auto">28</div>
        <h1 class="text-2xl font-black text-center mb-2 text-slate-800">欢迎回归</h1>
        <p class="text-slate-400 text-xs text-center mb-10 font-bold uppercase tracking-widest">登录您的商务账户</p>

        <div class="space-y-5">
            <div class="bg-slate-50 border border-slate-200 rounded-2xl px-6 flex items-center focus-within:border-blue-400 transition-colors">
                <i class="fas fa-user text-slate-300 text-sm"></i>
                <input type="text" id="username" class="w-full bg-transparent px-4 py-4 outline-none text-sm font-bold" placeholder="账号">
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl px-6 flex items-center focus-within:border-blue-400 transition-colors">
                <i class="fas fa-lock text-slate-300 text-sm"></i>
                <input type="password" id="password" class="w-full bg-transparent px-4 py-4 outline-none text-sm font-bold" placeholder="密码">
            </div>
            <button id="loginBtn" onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-100 active:scale-95 transition-all flex items-center justify-center">
                <span id="btnText">立即登录</span>
            </button>
        </div>
        <p class="mt-8 text-center text-xs text-slate-400 font-bold">没有账号？ <a href="/register.html" class="text-blue-600">立即注册</a><span class="mx-2 text-slate-200">|</span><a href="/forgot_password.html" class="text-blue-400">找回密码</a></p>
    </div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 3000);
        }

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');

            if(!u || !p) return showToast('请输入账号密码');

            btn.disabled = true;
            btnText.innerHTML = '登录中<span class="loading-dots"></span>';
            btn.classList.add('opacity-70');

            try {
                const response = await fetch('/api/login.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });

                if (!response.ok) {
                    throw new Error(`网络连接失败 (${response.status})`);
                }

                const r = await response.json();
                if(r.success) {
                    if(r.role === 'admin') location.href = '/admin/index.php';
                    else location.href = '/';
                } else {
                    showToast(r.message || '登录失败');
                    if(r.debug) console.error("Debug:", r.debug);
                }
            } catch (err) {
                showToast("连接服务器失败: " + err.message);
                console.error(err);
            } finally {
                btn.disabled = false;
                btnText.innerText = '立即登录';
                btn.classList.remove('opacity-70');
            }
        }

        // Enter key to login
        document.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') login();
        });
    </script>
</body>
</html>
