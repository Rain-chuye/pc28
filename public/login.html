<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 加拿大28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; }
        .login-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="login-card w-full max-w-md p-8 rounded-3xl border border-slate-700 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg rotate-12">
                <i class="fas fa-dice text-4xl text-black -rotate-12"></i>
            </div>
            <h1 class="text-2xl font-black text-white">欢迎回来</h1>
            <p class="text-slate-400 text-sm">请登录您的账号以继续</p>
        </div>

        <form action="api/login.php" method="POST" class="space-y-6">
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase mb-2">用户名 / 手机号</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input name="username" type="text" placeholder="demo_user" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-12 pr-4 text-white focus:outline-none focus:border-amber-500 transition-colors">
                </div>
            </div>
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase mb-2">密码</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input name="password" type="password" placeholder="••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-12 pr-4 text-white focus:outline-none focus:border-amber-500 transition-colors">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center gap-2 text-slate-400">
                    <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-0">
                    记住我
                </label>
                <a href="#" class="text-amber-500 font-bold">忘记密码？</a>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-black py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                立即登录
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-slate-800 text-center">
            <p class="text-slate-400 text-sm">还没有账号？ <a href="#" class="text-amber-500 font-bold underline">立即注册</a></p>
        </div>

        <!-- Preview Credentials -->
        <div class="mt-6 p-4 bg-slate-900/50 rounded-xl border border-slate-800">
            <div class="text-[10px] text-slate-500 font-bold uppercase mb-2">演示账号</div>
            <div class="grid grid-cols-2 gap-4 text-xs">
                <div>
                    <div class="text-slate-400">用户: demo_user</div>
                    <div class="text-slate-400">密码: 123456</div>
                </div>
                <div>
                    <div class="text-slate-400">管理: admin</div>
                    <div class="text-slate-400">密码: admin123</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
