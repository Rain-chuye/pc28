<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #f8fafc; font-family: -apple-system, sans-serif; }</style>
</head>
<body class="pb-10">
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-50 flex items-center gap-4">
        <button onclick="history.back()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 border border-slate-100"><i class="fas fa-chevron-left"></i></button>
        <h1 class="font-bold text-sm">个人资料与系统设置</h1>
    </header>

    <main class="p-6 space-y-6">
        <!-- Profile -->
        <section class="space-y-4">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest px-2">个人资料</h3>
            <div class="bg-white rounded-3xl border border-slate-200 p-6 space-y-4">
                <div class="space-y-2">
                    <p class="text-[10px] font-black text-slate-400 uppercase">个性昵称</p>
                    <input type="text" id="nick-input" class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-blue-400" placeholder="设置您的公开昵称">
                </div>
                <div class="space-y-2">
                    <p class="text-[10px] font-black text-slate-400 uppercase">修改登录密码</p>
                    <input type="password" id="pass-input" class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-blue-400" placeholder="留空则不修改">
                </div>
                <div class="space-y-2">
                    <p class="text-[10px] font-black text-slate-400 uppercase">绑定 QQ 号 (仅限绑定一次)</p>
                    <input type="text" id="qq-input" class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-sm font-bold outline-none focus:border-blue-400" placeholder="输入 QQ 号">
                </div>
            </div>
        </section>

        <!-- Theme Customization -->
        <section class="space-y-4">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest px-2">视觉风格定制</h3>
            <div class="bg-white rounded-3xl border border-slate-200 p-6 space-y-6">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-700">主色调</span>
                    <input type="color" id="theme-color" value="#2563eb" class="w-10 h-10 rounded-lg cursor-pointer">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-700">常规数字颜色</span>
                    <input type="color" id="num-color" value="#334155" class="w-10 h-10 rounded-lg cursor-pointer">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-700">大小单双颜色</span>
                    <input type="color" id="bssd-color" value="#2563eb" class="w-10 h-10 rounded-lg cursor-pointer">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-slate-700">组合特殊颜色</span>
                    <input type="color" id="special-color" value="#dc2626" class="w-10 h-10 rounded-lg cursor-pointer">
                </div>
            </div>
        </section>

        <button onclick="saveSettings()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 active:scale-95 transition-all">确认修改设置</button>
    </main>

    <script>
        async function load() {
            const r = await fetch('/api/user_info.php').then(r => r.json());
            if(r.success) {
                const u = r.user;
                document.getElementById('nick-input').value = u.nickname || '';
                if(u.qq_number) {
                    const qq = document.getElementById('qq-input');
                    qq.value = u.qq_number;
                    qq.readOnly = true;
                    qq.style.opacity = '0.5';
                }
                if(u.settings_json) {
                    const s = JSON.parse(u.settings_json);
                    if(s.theme) document.getElementById('theme-color').value = s.theme;
                    if(s.num) document.getElementById('num-color').value = s.num;
                    if(s.bssd) document.getElementById('bssd-color').value = s.bssd;
                    if(s.special) document.getElementById('special-color').value = s.special;
                }
            }
        }

        async function saveSettings() {
            const theme = {
                theme: document.getElementById('theme-color').value,
                num: document.getElementById('num-color').value,
                bssd: document.getElementById('bssd-color').value,
                special: document.getElementById('special-color').value
            };
            const payload = {
                nickname: document.getElementById('nick-input').value,
                qq: document.getElementById('qq-input').value,
                password: document.getElementById('pass-input').value,
                theme_settings: theme
            };

            const res = await fetch('/api/update_profile.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).then(r => r.json());

            if(res.success) { alert('设置已更新'); location.href = '/profile.html'; }
            else alert(res.message);
        }
        load();
    </script>
</body>
</html>
