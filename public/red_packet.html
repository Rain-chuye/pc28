<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红包福利群 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Emoji Picker -->
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; overflow: hidden; }
        .emoji-picker { position: absolute; bottom: 80px; right: 20px; z-index: 1000; display: none; }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-chevron-left text-xs"></i></button>
            <h1 class="font-black text-sm text-slate-800 tracking-tight">🧧 福利红包交流群</h1>
        </div>
        <div id="mute-badge" class="hidden bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-100">
            <p class="text-[10px] font-black text-rose-600 uppercase">禁言中</p>
        </div>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-5 space-y-4"></div>

    <div id="picker-container" class="emoji-picker shadow-2xl rounded-2xl"></div>

    <div class="p-4 bg-white border-t border-slate-200 flex flex-col gap-2 shrink-0">
        <div class="flex gap-3">
            <button onclick="toggleEmoji()" class="w-10 h-10 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200"><i class="far fa-smile text-lg"></i></button>
            <input type="text" id="msg-input" class="flex-1 bg-slate-50 border border-slate-100 rounded-xl px-5 outline-none font-bold text-sm" placeholder="来聊两句吧...">
            <button onclick="sendMsg()" class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg active:scale-95 transition-all"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const room = 'red_packet';
        const picker = new EmojiMart.Picker({
            onEmojiSelect: (emoji) => { document.getElementById('msg-input').value += emoji.native; toggleEmoji(); },
            set: 'native', theme: 'light'
        });
        document.getElementById('picker-container').appendChild(picker);
        function toggleEmoji() { const p = document.getElementById('picker-container'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }

        async function loadMsgs() {
            const res = await fetch(`/api/group_chat.php?room=${room}`).then(r => r.json());
            const settings = await fetch('/api/system_info.php').then(r => r.json());
            if(settings.success) {
                const isMuted = settings.data.chat_mute_all == '1';
                document.getElementById('mute-badge').classList.toggle('hidden', !isMuted);
            }
            if(res.success) {
                const box = document.getElementById('chat-box');
                box.innerHTML = res.data.map(m => {
                    if(m.type === 'red_packet') {
                        return `<div class="flex justify-center my-4"><div onclick="claimRedPacket(${m.packet_id})" class="bg-orange-500 text-white p-6 rounded-3xl shadow-xl border-4 border-orange-400 cursor-pointer active:scale-95 transition-all max-w-[280px]"><div class="flex flex-col items-center text-center"><div class="w-12 h-12 bg-orange-400 rounded-full flex items-center justify-center mb-3 border-2 border-white/20"><i class="fas fa-gift text-xl"></i></div><p class="text-[11px] font-black opacity-80 uppercase tracking-widest mb-1">系统派送 · 专属福利</p><p class="text-sm font-black leading-tight">${m.message}</p><div class="mt-4 bg-white/20 px-4 py-1.5 rounded-full text-[10px] font-black">点击立即开抢</div></div></div></div>`;
                    }
                    const isRobot = m.user_id == 0;
                    return `<div class="flex items-start gap-3"><img src="${m.avatar || '/assets/default_avatar.png'}" class="w-8 h-8 rounded-lg bg-slate-100 flex-shrink-0" onerror="this.src='/assets/default_avatar.png'"><div class="${isRobot ? 'bg-indigo-50 border border-indigo-100' : 'bg-white'} p-3 rounded-2xl shadow-sm text-sm font-bold max-w-[70%]"><p class="text-[9px] mb-1 font-black uppercase ${isRobot ? 'text-indigo-400' : 'text-slate-400'}">${m.username}</p>${m.message}</div></div>`;
                }).join('');
                box.scrollTop = box.scrollHeight;
            }
        }
        async function sendMsg() {
            const input = document.getElementById('msg-input'); const msg = input.value; if(!msg) return;
            const res = await fetch(`/api/group_chat.php?action=send&room=${room}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: msg}) }).then(r => r.json());
            if(!res.success) alert(res.message); else { input.value = ''; loadMsgs(); }
        }
        async function claimRedPacket(id) {
            const res = await fetch(`/api/group_chat.php?action=claim_red_packet&room=${room}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({packet_id: id}) }).then(r => r.json());
            if(res.success) alert('🎉 恭喜！领取到红包: ' + res.amount + ' 元'); else alert(res.message);
        }
        loadMsgs(); setInterval(loadMsgs, 5000);
    </script>
</body>
</html>
