<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #f8fafc; font-family: -apple-system, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm bg-white rounded-[2.5rem] p-10 border border-slate-200 shadow-xl">
        <h1 class="text-2xl font-black text-center mb-10 text-slate-800">重置安全密码</h1>
        <div class="space-y-5">
            <div class="bg-slate-50 border border-slate-200 rounded-2xl px-6 flex items-center">
                <i class="fas fa-user text-slate-300 text-xs"></i>
                <input type="text" id="username" class="w-full bg-transparent px-4 py-4 outline-none text-sm font-bold" placeholder="您的账号">
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl px-6 flex items-center">
                <i class="fab fa-qq text-slate-300 text-xs"></i>
                <input type="text" id="qq" class="w-full bg-transparent px-4 py-4 outline-none text-sm font-bold" placeholder="关联的QQ号">
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl px-6 flex items-center">
                <i class="fas fa-key text-slate-300 text-xs"></i>
                <input type="password" id="password" class="w-full bg-transparent px-4 py-4 outline-none text-sm font-bold" placeholder="设置新密码">
            </div>
            <button onclick="resetPass()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-100 active:scale-95 transition-all">立即重置</button>
        </div>
        <p class="mt-8 text-center text-xs text-slate-400 font-bold"><a href="/login.html" class="text-blue-600">返回登录</a></p>
    </div>
    <script>
        async function resetPass() {
            const u = document.getElementById('username').value;
            const q = document.getElementById('qq').value;
            const p = document.getElementById('password').value;
            if(!u || !q || !p) return alert('请填写完整');
            const res = await fetch('/api/forgot_password.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, qq: q, password: p})
            }).then(r => r.json());
            alert(res.message);
            if(res.success) location.href = '/login.html';
        }
    </script>
</body>
</html>
