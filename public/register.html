<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>注册 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #fff; font-family: -apple-system, sans-serif; }
        .login-card { min-height: 100vh; display: flex; flex-direction: column; padding: 2.5rem; justify-content: center; }
        .input-group { border-bottom: 2px solid #f8fafc; padding: 1rem 0; margin-bottom: 0.5rem; transition: border-color 0.3s; }
        .input-group:focus-within { border-color: #2563eb; }
        .input-field { width: 100%; border: none; outline: none; font-weight: 800; font-size: 1rem; color: #1e293b; padding: 0.5rem 0; background: transparent; }
        .btn-login { width: 100%; background: #2563eb; color: white; padding: 1.25rem; border-radius: 1.5rem; font-weight: 900; margin-top: 2rem; box-shadow: 0 10px 20px -5px rgba(37,99,235,0.2); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="mb-10">
            <h1 class="text-3xl font-black text-slate-800 tracking-tighter">加入我们</h1>
            <p class="text-slate-400 font-bold text-sm mt-2">开启您的 东爷国际 尊享之旅</p>
        </div>

        <div class="space-y-3">
            <div class="input-group">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">账号 / Username</p>
                <input type="text" id="username" class="input-field" placeholder="6-12位字母或数字">
            </div>
            <div class="input-group">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">密码 / Password</p>
                <input type="password" id="password" class="input-field" placeholder="请输入您的登录密码">
            </div>
            <div class="input-group">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">确认密码 / Confirm</p>
                <input type="password" id="confirm_password" class="input-field" placeholder="请再次输入密码">
            </div>
            <div class="input-group">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">邀请码 / Invitation (可选)</p>
                <input type="text" id="ref" class="input-field" placeholder="如有请填写">
            </div>
        </div>

        <button onclick="register()" class="btn-login">立即注册</button>

        <div class="mt-8 text-center text-xs font-black uppercase tracking-tighter">
            <span class="text-slate-300">已有账号？</span>
            <a href="/login.html" class="text-blue-600 ml-1">前往登录</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if(params.has('ref')) document.getElementById('ref').value = params.get('ref');

        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const ref = document.getElementById('ref').value;

            if(!username || !password) return alert('请填写完整');
            if(password !== confirm_password) return alert('两次密码不一致');

            const res = await fetch('/api/register.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password, inviter_id: ref })
            }).then(r => r.json());

            if(res.success) {
                alert('注册成功');
                location.href = '/login.html';
            } else alert(res.message);
        }
    </script>
</body>
</html>
