<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加拿大28 - 投注</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #0f172a; color: white; }
        .bet-item { background: #1e293b; border: 1px solid #334155; cursor: pointer; }
        .bet-item.active { border-color: #f59e0b; background: #334155; box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body class="pb-24">
    <!-- Top Bar -->
    <div class="flex items-center justify-between p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <a href="index.html" class="text-gray-400"><i class="fas fa-chevron-left text-lg"></i></a>
        <h1 class="text-lg font-bold" id="game-title">加拿大 28</h1>
        <button class="text-gray-400"><i class="fas fa-history"></i></button>
    </div>

    <!-- Balance & Result -->
    <div class="p-4 bg-slate-900 mb-2">
        <div class="flex justify-between items-center mb-4">
            <span class="text-slate-400 text-sm">可用余额: <span class="text-emerald-400 font-bold" id="user-balance">¥ 12,580.00</span></span>
            <div class="flex gap-2">
                <button class="bg-slate-800 text-white px-3 py-1 rounded-full text-xs border border-slate-700">规则</button>
                <button class="bg-amber-500 text-black px-4 py-1 rounded-full text-xs font-bold">充值</button>
            </div>
        </div>
        <div class="bg-slate-800 rounded-xl p-4 flex items-center justify-between border border-slate-700/50">
            <div>
                <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">20240616-088 期 开奖</div>
                <div class="flex gap-2 items-center">
                    <span class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold shadow-lg">3</span>
                    <span class="text-slate-500 font-bold">+</span>
                    <span class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold shadow-lg">7</span>
                    <span class="text-slate-500 font-bold">+</span>
                    <span class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold shadow-lg">10</span>
                    <span class="text-xl font-black text-amber-500 ml-2">= 20</span>
                </div>
            </div>
            <div class="text-right border-l border-slate-700 pl-4">
                <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">距离下期</div>
                <div class="text-xl font-mono font-bold text-orange-400" id="timer">02:45</div>
            </div>
        </div>
    </div>

    <!-- Betting Grid -->
    <div class="px-4 py-2">
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bet-item p-4 rounded-xl text-center shadow-lg active:scale-95 transition-all" onclick="selectBet(this, 'big')">
                <div class="text-2xl font-black">大</div>
                <div class="text-xs text-slate-400 mt-1 odds-val">1.95</div>
            </div>
            <div class="bet-item p-4 rounded-xl text-center shadow-lg active:scale-95 transition-all" onclick="selectBet(this, 'small')">
                <div class="text-2xl font-black">小</div>
                <div class="text-xs text-slate-400 mt-1 odds-val">1.95</div>
            </div>
            <div class="bet-item p-4 rounded-xl text-center shadow-lg active:scale-95 transition-all" onclick="selectBet(this, 'single')">
                <div class="text-2xl font-black text-rose-500">单</div>
                <div class="text-xs text-slate-400 mt-1 odds-val">1.95</div>
            </div>
            <div class="bet-item p-4 rounded-xl text-center shadow-lg active:scale-95 transition-all" onclick="selectBet(this, 'double')">
                <div class="text-2xl font-black text-indigo-400">双</div>
                <div class="text-xs text-slate-400 mt-1 odds-val">1.95</div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-8">
            <div class="bet-item p-2 rounded-lg text-center text-xs" onclick="selectBet(this, 'big_single')">
                <div>大单</div>
                <div class="text-[10px] text-slate-500 odds-val">3.7</div>
            </div>
            <div class="bet-item p-2 rounded-lg text-center text-xs" onclick="selectBet(this, 'big_double')">
                <div>大双</div>
                <div class="text-[10px] text-slate-500 odds-val">3.7</div>
            </div>
            <div class="bet-item p-2 rounded-lg text-center text-xs" onclick="selectBet(this, 'small_single')">
                <div>小单</div>
                <div class="text-[10px] text-slate-500 odds-val">3.7</div>
            </div>
            <div class="bet-item p-2 rounded-lg text-center text-xs" onclick="selectBet(this, 'small_double')">
                <div>小双</div>
                <div class="text-[10px] text-slate-500 odds-val">3.7</div>
            </div>
            <div class="bet-item p-2 rounded-lg text-center text-xs" onclick="selectBet(this, 'extreme_big')">
                <div>极大</div>
                <div class="text-[10px] text-slate-500 odds-val">10.0</div>
            </div>
            <div class="bet-item p-2 rounded-lg text-center text-xs" onclick="selectBet(this, 'extreme_small')">
                <div>极小</div>
                <div class="text-[10px] text-slate-500 odds-val">10.0</div>
            </div>
            <div class="bet-item p-2 rounded-lg text-center text-xs" onclick="selectBet(this, 'leopard')">
                <div>豹子</div>
                <div class="text-[10px] text-slate-500 odds-val">50.0</div>
            </div>
            <div class="bet-item p-2 rounded-lg text-center text-xs" onclick="selectBet(this, 'red_wave')">
                <div>红波</div>
                <div class="text-[10px] text-slate-500 odds-val">2.5</div>
            </div>
        </div>

        <!-- Numbers Grid 0-27 -->
        <div class="grid grid-cols-7 gap-2">
            <script>
                for(let i=0; i<=27; i++) {
                    document.write(`<div class="bet-item w-10 h-10 rounded-lg flex items-center justify-center text-xs font-bold" onclick="selectBet(this, '${i}')">${i}</div>`);
                }
            </script>
        </div>
    </div>

    <!-- Betting Footer -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-4 flex gap-4 items-center z-50">
        <div class="flex-1 bg-slate-800 rounded-full px-4 py-2 flex items-center gap-2 border border-slate-700">
            <span class="text-slate-500 text-xs">金额:</span>
            <input type="number" id="bet-amount" placeholder="输入金额" class="bg-transparent border-none focus:outline-none text-white text-sm w-full">
        </div>
        <button class="bg-amber-500 text-black px-8 py-2 rounded-full font-bold shadow-lg active:scale-95 transition-transform" onclick="submitBet()">下注</button>
    </div>

    <script>
        let selectedType = null;
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');

        if (type === 'high') {
            document.getElementById('game-title').innerText = '加拿大 28 (高赔率)';
            document.querySelectorAll('.odds-val').forEach(el => {
                const val = parseFloat(el.innerText);
                if (val === 1.95) el.innerText = '2.05';
                if (val === 3.7) el.innerText = '4.1';
            });
        }

        function selectBet(el, playType) {
            document.querySelectorAll('.bet-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            selectedType = playType;
        }

        async function submitBet() {
            const amount = document.getElementById('bet-amount').value;
            if (!selectedType) return alert('请先选择投注项');
            if (!amount || amount <= 0) return alert('请输入有效金额');

            try {
                const res = await fetch('/api/bet.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ play_type: selectedType, amount: parseFloat(amount) })
                });
                const data = await res.json();
                if (data.success) {
                    alert('投注成功！');
                    location.reload();
                } else {
                    alert('错误: ' + data.message);
                }
            } catch (e) {
                alert('网络连接失败');
            }
        }

        let time = 165;
        setInterval(() => {
            const m = Math.floor(time / 60);
            const s = time % 60;
            document.getElementById('timer').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            if(--time < 0) time = 300;
        }, 1000);
    </script>
</body>
</html>
