<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加拿大 28 - 游戏房间</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; color: #334155; font-family: -apple-system, sans-serif; }
        .ball { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; background: white; border: 1px solid #e2e8f0; }
        .ball-sum { background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
        .bet-item { background: white; border: 1px solid #e2e8f0; padding: 14px; border-radius: 12px; text-align: center; transition: all 0.2s; cursor: pointer; }
        .bet-item:active { transform: scale(0.96); }
        .bet-item.active { background: #2563eb; color: white; border-color: #2563eb; font-weight: 800; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: 800; }
        .mipai-overlay { position: absolute; inset: -1px; background: #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 20; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .revealed .mipai-overlay { transform: translateY(-100%) rotate(20deg); opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="pb-40">
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"><i class="fas fa-chevron-left text-xs"></i></button>
            <div>
                <h1 id="room-title" class="text-xs font-black uppercase text-slate-400 tracking-tighter">Canada 28</h1>
                <p id="issue-display" class="text-[11px] font-bold text-slate-800">正在同步...</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="quickCheckScore()" class="bg-blue-600 text-white text-[10px] px-3 py-1.5 rounded-lg font-black shadow-md shadow-blue-100">查分</button>
            <button onclick="openReturnModal()" class="bg-white border border-slate-200 text-slate-600 text-[10px] px-3 py-1.5 rounded-lg font-black">回分</button>
        </div>
    </header>

    <main class="p-4 space-y-4">
        <!-- Result Panel -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
            <div class="flex flex-col items-center gap-4 relative z-10">
                <div class="flex items-center gap-3">
                    <div class="num-ball ball">?</div>
                    <span class="text-slate-300 text-xs font-black">+</span>
                    <div class="num-ball ball">?</div>
                    <span class="text-slate-300 text-xs font-black">+</span>
                    <div class="num-ball ball">?</div>
                    <span class="text-slate-300 text-xs font-black">=</span>
                    <div class="mipai-container relative w-10 h-10">
                        <div class="mipai-overlay" onclick="this.parentElement.classList.add('revealed')">
                            <i class="fas fa-fingerprint text-slate-500 text-sm"></i>
                        </div>
                        <div id="total-result" class="ball ball-sum">?</div>
                    </div>
                </div>
                <div id="timer-display" class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50 px-4 py-1.5 rounded-full border border-slate-100">
                    Next Draw: <span class="text-blue-600 font-mono">00:00</span>
                </div>
            </div>
        </div>

        <!-- Real-time Ticker -->
        <div class="h-8 overflow-hidden bg-white/50 rounded-xl px-4 border border-dashed border-slate-300">
            <div id="live-feed-container" class="transition-all duration-700">
                <p class="text-[10px] text-slate-400 py-2 font-medium">连接云端数据中...</p>
            </div>
        </div>

        <!-- Betting Tabs -->
        <div class="flex gap-8 border-b border-slate-200 px-2 pt-2">
            <button onclick="switchTab('basic')" id="tab-basic" class="pb-3 text-xs font-bold tab-active">常用玩法</button>
            <button onclick="switchTab('special')" id="tab-special" class="pb-3 text-xs font-bold text-slate-400">高级组合</button>
            <button onclick="switchTab('numbers')" id="tab-numbers" class="pb-3 text-xs font-bold text-slate-400">特码定位</button>
            <button onclick="switchTab('history')" id="tab-history" class="pb-3 text-xs font-bold text-slate-400">近期开奖</button>
        </div>

        <!-- Panels -->
        <div id="pane-basic" class="grid grid-cols-2 gap-3 pt-2">
            <div class="bet-item" onclick="toggleBet(this, 'big')">大 <span class="text-[10px] text-slate-400 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'small')">小 <span class="text-[10px] text-slate-400 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'single')">单 <span class="text-[10px] text-slate-400 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'double')">双 <span class="text-[10px] text-slate-400 ml-1">2.00</span></div>
        </div>

        <div id="pane-special" class="hidden grid grid-cols-2 gap-3 pt-2">
            <div class="bet-item" onclick="toggleBet(this, 'big_single')">大单 <span class="text-[10px] text-slate-400 ml-1">3.80</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'big_double')">大双 <span class="text-[10px] text-slate-400 ml-1">3.80</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'small_single')">小单 <span class="text-[10px] text-slate-400 ml-1">3.80</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'small_double')">小双 <span class="text-[10px] text-slate-400 ml-1">3.80</span></div>
        </div>

        <div id="pane-numbers" class="hidden grid grid-cols-5 gap-2 pt-2">
            <script>
                for(let i=0; i<=27; i++) {
                    document.write(`<div class="bet-item !p-2 !rounded-lg text-sm font-bold" onclick="toggleBet(this, '${i}')">${i}</div>`);
                }
            </script>
        </div>

        <div id="pane-history" class="hidden space-y-2 pt-2"></div>
    </main>

    <!-- Bottom Bet Console -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-4 z-50">
        <div class="max-w-md mx-auto flex items-center gap-4">
            <div class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 flex items-center shadow-inner">
                <i class="fas fa-coins text-slate-300 mr-3 text-xs"></i>
                <input type="number" id="bet-amount" class="w-full bg-transparent py-3.5 outline-none text-sm font-black text-blue-600" placeholder="下注积分">
            </div>
            <button onclick="submitBets()" class="bg-blue-600 text-white px-8 py-3.5 rounded-xl font-black text-sm shadow-lg shadow-blue-200 active:scale-95 transition-all">
                立即下单 (<span id="selected-count">0</span>)
            </button>
        </div>
    </div>

    <!-- Modals -->
    <div id="return-modal" class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-xs rounded-3xl p-8 border border-slate-200 shadow-2xl">
            <h2 class="text-lg font-black text-center mb-6 text-slate-800">申请回分 (提现)</h2>
            <div class="space-y-5">
                <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200">
                    <p class="text-[10px] text-slate-400 mb-2 uppercase font-black">回分分值 (最低 50)</p>
                    <input type="number" id="return-amount" class="w-full bg-transparent text-2xl font-black outline-none text-blue-600" placeholder="0">
                </div>
                <div class="bg-red-50 p-4 rounded-xl text-[9px] text-red-500 font-bold leading-relaxed">
                    温馨提示：回分需满足充值总额 4 倍流水，最低 50 积分起。
                </div>
                <div class="flex gap-3">
                    <button onclick="closeReturnModal()" class="flex-1 py-4 bg-slate-100 rounded-2xl text-xs font-black text-slate-500">取消</button>
                    <button onclick="submitScoreReturn()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl text-xs font-black shadow-lg shadow-blue-100">确认提交</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-10 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const oddsMode = params.get('room') || 'low';
        let selectedBets = new Set();
        let currentIssue = '';
        let lastLotteryId = '';

        function showToast(m, t='info') {
            const el = document.createElement('div');
            el.className = `px-6 py-2.5 rounded-full text-[11px] font-black shadow-2xl transition-all border ${t==='success' ? 'bg-blue-600 text-white border-blue-400' : 'bg-white text-slate-800 border-slate-100'}`;
            el.innerText = m;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function switchTab(t) {
            ['basic', 'special', 'numbers', 'history'].forEach(p => {
                document.getElementById(`pane-${p}`).classList.add('hidden');
                document.getElementById(`tab-${p}`).classList.remove('tab-active');
                document.getElementById(`tab-${p}`).classList.add('text-slate-400');
            });
            document.getElementById(`pane-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('tab-active');
            document.getElementById(`tab-${t}`).classList.remove('text-slate-400');
            if(t === 'history') loadHistory();
        }

        function toggleBet(el, type) {
            if(selectedBets.has(type)) { selectedBets.delete(type); el.classList.remove('active'); }
            else { selectedBets.add(type); el.classList.add('active'); }
            document.getElementById('selected-count').innerText = selectedBets.size;
        }

        async function submitBets() {
            const amount = document.getElementById('bet-amount').value;
            if (selectedBets.size === 0) return showToast('请先选择玩法');
            if (!amount || amount < 2) return showToast('单注最低 2 积分');
            const bets = Array.from(selectedBets).map(t => ({ play_type: t, amount: parseFloat(amount) }));
            try {
                const res = await fetch('/api/bet.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bets, odds_type: oddsMode, issue_no: currentIssue })
                });
                const data = await res.json();
                if(data.success) {
                    showToast('下单成功', 'success');
                    selectedBets.clear();
                    document.querySelectorAll('.bet-item').forEach(i => i.classList.remove('active'));
                    document.getElementById('selected-count').innerText = 0;
                } else showToast(data.message);
            } catch (e) { showToast('网络连接超时'); }
        }

        async function refreshData() {
            try {
                const res = await fetch('/api/lottery.php').then(r => r.json());
                if(res.latest) {
                    currentIssue = res.latest.issue_no;
                    document.getElementById('issue-display').innerText = `第 ${currentIssue} 期正在接受下单`;
                    const nums = res.latest.numbers.split(',');
                    const balls = document.querySelectorAll('.num-ball');
                    balls[0].innerText = nums[0];
                    balls[1].innerText = nums[1];
                    balls[2].innerText = nums[2];
                    document.getElementById('total-result').innerText = res.latest.total_sum;
                    if(lastLotteryId !== currentIssue) {
                        lastLotteryId = currentIssue;
                        document.querySelector('.mipai-container').classList.remove('revealed');
                    }
                }
                const feed = await fetch('/api/live_bets.php').then(r => r.json());
                if(feed.data && feed.data.length > 0) {
                    const container = document.getElementById('live-feed-container');
                    container.innerHTML = feed.data.slice(0, 8).map(b => `
                        <div class="text-[10px] text-slate-400 py-2 font-bold truncate">
                            <span class="text-blue-600">用户 ${b.username.substring(0,3)}***</span> 刚刚成功下注 <span class="text-slate-600">${b.play_type}</span> <span class="text-blue-500">¥${Math.floor(b.bet_amount)}</span>
                        </div>
                    `).join('');
                }
            } catch(e) {}
        }

        async function loadHistory() {
            const res = await fetch('/api/lottery.php?limit=20').then(r => r.json());
            if(res.history) {
                document.getElementById('pane-history').innerHTML = res.history.map(h => `
                    <div class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-100">
                        <span class="text-[10px] text-slate-400 font-bold">#${h.issue_no}</span>
                        <div class="flex items-center gap-4">
                            <span class="text-[10px] px-2 py-0.5 bg-slate-50 rounded text-slate-500 font-bold">${h.numbers}</span>
                            <span class="text-xs font-black text-blue-600 w-6 text-right">${h.total_sum}</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function quickCheckScore() {
            try {
                const res = await fetch('/api/quick_finance.php?action=check').then(r => r.json());
                if(res.success) showToast(`您的当前分数: ¥${parseFloat(res.balance).toLocaleString()}`, 'success');
            } catch(e) { showToast('无法连接查分接口'); }
        }

        function openReturnModal() { document.getElementById('return-modal').classList.remove('hidden'); }
        function closeReturnModal() { document.getElementById('return-modal').classList.add('hidden'); }

        async function submitScoreReturn() {
            const amount = document.getElementById('return-amount').value;
            if(!amount || amount < 50) return showToast('回分金额最低 50');
            const res = await fetch('/api/quick_finance.php?action=return', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({amount: parseFloat(amount)})
            });
            const data = await res.json();
            showToast(data.message, data.success ? 'success' : 'info');
            if(data.success) closeReturnModal();
        }

        setInterval(refreshData, 6000);
        refreshData();
    </script>
</body>
</html>
