<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC28 - 游戏中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style id="custom-theme">
        :root { --theme-color: #2563eb; --num-color: #334155; --bssd-color: #2563eb; --special-color: #dc2626; --combo-color: #7c3aed; --extreme-color: #ea580c; }
    </style>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, system-ui, sans-serif; color: #1e293b; }
        .ball { width: 30px; height: 30px; background: #e2e8f0; border-radius: 50%; display: flex; items-center: center; justify-content: center; font-weight: 900; font-size: 14px; color: #475569; }
        .ball-sum { background: var(--theme-color); color: white; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 34px; height: 34px; }
        .ball-13-14 { background: #f59e0b !important; }
        .scratch-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 2rem; position: relative; overflow: hidden; height: 160px; display: flex; align-items: center; justify-content: center; transition: all 0.5s ease; cursor: pointer; }
        .scratch-mask { position: absolute; inset: 0; background: #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .scratch-card.scratched .scratch-mask { transform: translateY(-100%); }
        .scratch-content { display: flex; flex-direction: column; align-items: center; z-index: 5; }
        .bet-item { background: white; border: 1px solid #f1f5f9; border-radius: 1.25rem; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .bet-item:active { transform: scale(0.95); }
        .bet-item.active { border-color: var(--theme-color); background: #eff6ff; box-shadow: 0 0 0 2px var(--theme-color); }
        .tag { font-size: 9px; font-weight: 900; padding: 2px 8px; border-radius: 100px; color: white; }
        .tag-win { background: #2563eb; }
        .tag-special { background: #dc2626; }
        .tag-combo { background: #7c3aed; }
        .tag-extreme { background: #ea580c; }
        .tab-active { color: var(--theme-color); position: relative; }
        .tab-active:after { content: ''; position: absolute; bottom: 0; left: 25%; width: 50%; height: 3px; background: var(--theme-color); border-radius: 100px; }
        .chat-bubble-admin { background: #f1f5f9; color: #1e293b; border-radius: 1.5rem 1.5rem 1.5rem 0.25rem; }
        .chat-bubble-user { background: var(--theme-color); color: white; border-radius: 1.5rem 1.5rem 0.25rem 1.5rem; }
        .color-bssd { color: var(--bssd-color); }
        .color-special { color: var(--special-color); }
        .color-combo { color: var(--combo-color); }
        .color-extreme { color: var(--extreme-color); }
    </style>
</head>
<body class="pb-32">
    <header class="bg-white px-6 py-4 flex justify-between items-center border-b border-slate-100 sticky top-0 z-50">
        <button onclick="location.href='/'" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-400"><i class="fas fa-chevron-left"></i></button>
        <div class="text-center">
            <h1 id="issue-display" class="text-xs font-black text-slate-400 uppercase tracking-widest">下注期号: 加载中</h1>
            <p id="room-display" class="text-[9px] font-bold text-blue-600 mt-1 uppercase">Loading Mode...</p>
        </div>
        <button onclick="toggleChat()" class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 shadow-sm"><i class="fas fa-headset"></i></button>
    </header>

    <main class="p-5 space-y-6">
        <!-- Scratch Result Card -->
        <div class="space-y-3">
            <div id="scratch-card" class="scratch-card" onclick="scratch()">
                <div class="scratch-mask">
                    <div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center mb-2"><i class="fas fa-magic text-white text-2xl animate-pulse"></i></div>
                    <span class="text-white font-black uppercase text-[10px] tracking-widest">刮开揭晓上期开奖详情</span>
                </div>
                <div class="scratch-content">
                    <div id="scratch-calc" class="text-2xl font-black text-white mb-2">? + ? + ? = ?</div>
                    <div class="flex items-center gap-3">
                        <div class="ball" id="ball-0">-</div>
                        <i class="fas fa-plus text-[10px] text-slate-500"></i>
                        <div class="ball" id="ball-1">-</div>
                        <i class="fas fa-plus text-[10px] text-slate-500"></i>
                        <div class="ball" id="ball-2">-</div>
                        <i class="fas fa-equals text-[10px] text-slate-500"></i>
                        <div class="ball ball-sum" id="total-result">-</div>
                    </div>
                    <div id="result-tags" class="flex gap-2 mt-3 flex-wrap justify-center"></div>
                </div>
            </div>
            <div id="timer-display" class="text-center mt-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">NEXT DRAW: --:--</div>
        </div>

        <!-- Betting Tabs -->
        <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="flex border-b border-slate-100">
                <button id="tab-basic" onclick="switchTab('basic')" class="flex-1 py-4 text-[11px] font-black uppercase tab-active">基础玩法</button>
                <button id="tab-special" onclick="switchTab('special')" class="flex-1 py-4 text-[11px] font-black uppercase text-slate-400">组合/特殊</button>
                <button id="tab-numbers" onclick="switchTab('numbers')" class="flex-1 py-4 text-[11px] font-black uppercase text-slate-400">猜特码</button>
                <button id="tab-history" onclick="switchTab('history')" class="flex-1 py-4 text-[11px] font-black uppercase text-slate-400">历史</button>
            </div>

            <div class="p-5">
                <div id="pane-basic" class="grid grid-cols-2 gap-3">
                    <div onclick="toggleBet(this, '大')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">大</p><p class="text-lg font-black mt-1 color-bssd" id="odds-big">--</p></div>
                    <div onclick="toggleBet(this, '小')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">小</p><p class="text-lg font-black mt-1 color-bssd" id="odds-small">--</p></div>
                    <div onclick="toggleBet(this, '单')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">单</p><p class="text-lg font-black mt-1 color-bssd" id="odds-single">--</p></div>
                    <div onclick="toggleBet(this, '双')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">双</p><p class="text-lg font-black mt-1 color-bssd" id="odds-double">--</p></div>
                </div>

                <div id="pane-special" class="hidden grid grid-cols-2 gap-3">
                    <div onclick="toggleBet(this, '大单')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">大单</p><p class="text-lg font-black mt-1 color-combo" id="odds-big_single">--</p></div>
                    <div onclick="toggleBet(this, '大双')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">大双</p><p class="text-lg font-black mt-1 color-combo" id="odds-big_double">--</p></div>
                    <div onclick="toggleBet(this, '小单')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">小单</p><p class="text-lg font-black mt-1 color-combo" id="odds-small_single">--</p></div>
                    <div onclick="toggleBet(this, '小双')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">小双</p><p class="text-lg font-black mt-1 color-combo" id="odds-small_double">--</p></div>
                    <div onclick="toggleBet(this, '极大')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">极大</p><p class="text-lg font-black mt-1 color-extreme" id="odds-extreme_big">--</p></div>
                    <div onclick="toggleBet(this, '极小')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">极小</p><p class="text-lg font-black mt-1 color-extreme" id="odds-extreme_small">--</p></div>
                    <div onclick="toggleBet(this, '对子')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">对子</p><p class="text-lg font-black mt-1 color-special" id="odds-pair">--</p></div>
                    <div onclick="toggleBet(this, '顺子')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">顺子</p><p class="text-lg font-black mt-1 color-special" id="odds-straight">--</p></div>
                    <div onclick="toggleBet(this, '豹子')" class="bet-item"><p class="text-[10px] font-bold text-slate-400 uppercase">豹子</p><p class="text-lg font-black mt-1 color-special" id="odds-triple">--</p></div>
                </div>

                <div id="pane-numbers" class="hidden grid grid-cols-5 gap-2"></div>
                <div id="pane-history" class="hidden space-y-2"></div>
            </div>
        </div>
    </main>

    <!-- Modal: Announcement -->
    <div id="announce-modal" class="fixed inset-0 z-[300] bg-black/60 backdrop-blur-md hidden flex items-center justify-center p-6">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl relative border-t-8 border-blue-600">
            <h3 class="text-xl font-black text-slate-800 mb-4 flex items-center gap-2"><i class="fas fa-bullhorn text-blue-600"></i> 系统公告</h3>
            <div id="announce-content" class="text-sm text-slate-500 leading-relaxed font-bold max-h-60 overflow-y-auto mb-6 bg-slate-50 p-4 rounded-xl"></div>
            <button onclick="closeAnnounce()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">我已阅读并知晓</button>
        </div>
    </div>

    <!-- Chat Overlay -->
    <div id="chat-overlay" class="fixed inset-0 z-[200] bg-black/40 backdrop-blur-sm hidden flex flex-col justify-end">
        <div class="bg-white rounded-t-[2.5rem] h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600"><i class="fas fa-headset"></i></div>
                    <div><h2 class="text-sm font-black">在线客服中心</h2><p class="text-[9px] text-green-500 font-bold uppercase tracking-widest flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> 私聊客服 - 只有您和客服可见</p></div>
                </div>
                <button onclick="toggleChat()" class="w-10 h-10 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 bg-slate-50/50"></div>
            <div class="p-6 bg-white border-t border-slate-100 flex gap-4">
                <input type="text" id="chat-input" class="flex-1 bg-slate-50 border-none rounded-2xl px-6 outline-none font-bold text-sm" placeholder="输入您的问题...">
                <button onclick="sendChatMessage()" class="bg-blue-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl shadow-blue-100"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Fixed Betting Bar -->
    <div class="fixed bottom-0 left-0 right-0 z-[100] bg-white/90 backdrop-blur-xl border-t border-slate-200 p-5 safe-bottom">
        <div class="max-w-md mx-auto flex gap-4">
            <div class="flex-1 bg-slate-100 rounded-2xl flex items-center px-4 gap-3">
                <span class="text-[10px] font-black text-slate-400 uppercase">Amt</span>
                <input type="number" id="bet-amount" class="bg-transparent border-none outline-none font-black text-blue-600 w-full" placeholder="积分" value="100">
            </div>
            <button onclick="submitBets()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black text-sm shadow-xl shadow-blue-200 active:scale-95 transition-all">
                确认下单 (<span id="selected-count">0</span>)
            </button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const oddsMode = params.get('room') || 'high';
        document.getElementById('room-display').innerText = oddsMode === 'high' ? '加拿大至尊房' : '经典大厅';

        let selectedBets = new Set();
        let timeLeft = 0;
        let betIssue = '';
        let lastLotteryId = '';
        let globalOdds = {};

        function scratch() { document.getElementById('scratch-card').classList.add('scratched'); }

        async function refreshData() {
            try {
                const res = await fetch('/api/lottery.php').then(r => r.json());
                if(res.latest) {
                    betIssue = res.bet_issue_no;
                    document.getElementById('issue-display').innerText = `下注期号: ${betIssue}`;
                    if(lastLotteryId !== res.latest.issue_no) {
                        lastLotteryId = res.latest.issue_no;
                        document.getElementById('scratch-card').classList.remove('scratched');
                    }
                    const nums = res.latest.numbers.split(',').map(n => parseInt(n));
                    const sum = parseInt(res.latest.total_sum);
                    document.getElementById('ball-0').innerText = nums[0];
                    document.getElementById('ball-1').innerText = nums[1];
                    document.getElementById('ball-2').innerText = nums[2];
                    const sumBall = document.getElementById('total-result');
                    sumBall.innerText = sum;
                    if(sum === 13 || sum === 14) sumBall.classList.add('ball-13-14');
                    else sumBall.classList.remove('ball-13-14');
                    document.getElementById('scratch-calc').innerText = `${nums[0]} + ${nums[1]} + ${nums[2]} = ${sum}`;
                    const tags = [];
                    const isBig = sum >= 14;
                    const isSingle = sum % 2 != 0;
                    tags.push(isBig ? '大' : '小');
                    tags.push(isSingle ? '单' : '双');
                    tags.push((isBig ? '大' : '小') + (isSingle ? '单' : '双'));
                    if(nums[0] === nums[1] && nums[1] === nums[2]) tags.push('豹子');
                    else if(isStraight(nums)) tags.push('顺子');
                    else if(nums[0] === nums[1] || nums[1] === nums[2] || nums[0] === nums[2]) tags.push('对子');
                    if(sum >= 22) tags.push('极大');
                    if(sum <= 5) tags.push('极小');
                    document.getElementById('result-tags').innerHTML = tags.map(t => `<span class="tag ${['豹子','顺子','对子'].includes(t) ? 'tag-special' : (['极大','极小'].includes(t) ? 'tag-extreme' : (t.length > 1 ? 'tag-combo' : 'tag-win'))}">${t}</span>`).join('');
                    timeLeft = res.countdown;
                    startCountdown();
                }
                if(!localStorage.getItem('announced')) {
                    document.getElementById('announce-content').innerText = res.announcement;
                    document.getElementById('announce-modal').classList.remove('hidden');
                }
                if(res.odds) { globalOdds = res.odds; renderOdds(); }
            } catch(e) {}
        }

        function isStraight(nums) {
            nums.sort((a,b) => a-b);
            if(nums[1] === nums[0]+1 && nums[2] === nums[1]+1) return true;
            const set = JSON.stringify(nums);
            if(set === '[0,1,9]' || set === '[0,8,9]') return true;
            return false;
        }

        function renderOdds() {
            const keys = {
                'big': 'odds-big', 'small': 'odds-small', 'single': 'odds-single', 'double': 'odds-double',
                'big_single': 'odds-big_single', 'big_double': 'odds-big_double', 'small_single': 'odds-small_single', 'small_double': 'odds-small_double',
                'extreme_big': 'odds-extreme_big', 'extreme_small': 'odds-extreme_small', 'pair': 'odds-pair', 'straight': 'odds-straight', 'triple': 'odds-triple'
            };
            Object.entries(keys).forEach(([k, id]) => {
                if(globalOdds[k]) document.getElementById(id).innerText = globalOdds[k][oddsMode].toFixed(2);
            });
            const pane = document.getElementById('pane-numbers');
            pane.innerHTML = '';
            for(let i=0; i<=27; i++) {
                const type = i.toString();
                const odds = globalOdds[type] ? globalOdds[type][oddsMode] : 12.0;
                const div = document.createElement('div');
                div.className = 'bet-item p-2 flex flex-col items-center justify-center';
                div.onclick = () => toggleBet(div, type);
                div.innerHTML = `<p class="text-[12px] font-black">${i}</p><p class="text-[8px] font-bold text-slate-400 mt-1">${odds.toFixed(1)}</p>`;
                if(selectedBets.has(type)) div.classList.add('active');
                pane.appendChild(div);
            }
        }

        function startCountdown() {
            if(window.timer) clearInterval(window.timer);
            window.timer = setInterval(() => {
                if(timeLeft <= 0) return clearInterval(window.timer);
                timeLeft--;
                const m = Math.floor(timeLeft/60); const s = timeLeft%60;
                const timeStr = `${m}:${s<10?'0':''}${s}`;
                document.getElementById('timer-display').innerHTML = timeLeft <= 15 ? `<span class="text-red-500 font-black">已封盘</span> <span class="ml-2 font-mono">${timeStr}</span>` : `NEXT DRAW: <span class="text-blue-600 font-mono font-black">${timeStr}</span>`;
            }, 1000);
        }

        function switchTab(t) {
            ['basic', 'special', 'numbers', 'history'].forEach(p => {
                document.getElementById('pane-'+p).classList.add('hidden');
                document.getElementById('tab-'+p).classList.remove('tab-active');
                document.getElementById('tab-'+p).classList.add('text-slate-400');
            });
            document.getElementById('pane-'+t).classList.remove('hidden');
            document.getElementById('tab-'+t).classList.add('tab-active');
            document.getElementById('tab-'+t).classList.remove('text-slate-400');
            if(t === 'history') loadHistory();
        }

        async function loadHistory() {
            const res = await fetch('/api/lottery.php').then(r => r.json());
            document.getElementById('pane-history').innerHTML = res.history.map(i => `
                <div class="px-4 py-3 bg-slate-50 rounded-xl flex justify-between items-center">
                    <span class="text-[10px] font-black text-slate-400 uppercase">#${i.issue_no}</span>
                    <div class="flex items-center gap-3">
                        <div class="flex gap-1">${i.numbers.split(',').map(n => `<span class="w-5 h-5 bg-white rounded-full flex items-center justify-center text-[10px] font-black border border-slate-100">${n}</span>`).join('')}</div>
                        <span class="text-sm font-black text-blue-600">${i.total_sum}</span>
                    </div>
                </div>
            `).join('');
        }

        function toggleBet(el, type) {
            if(selectedBets.has(type)) { selectedBets.delete(type); el.classList.remove('active'); }
            else { selectedBets.add(type); el.classList.add('active'); }
            document.getElementById('selected-count').innerText = selectedBets.size;
        }

        async function submitBets() {
            const amount = document.getElementById('bet-amount').value;
            if (selectedBets.size === 0) return alert('请选择玩法');
            const bets = Array.from(selectedBets).map(t => ({ play_type: t, amount: parseFloat(amount) }));
            const res = await fetch('/api/bet.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bets, odds_type: oddsMode, issue_no: betIssue }) }).then(r => r.json());
            if(res.success) {
                selectedBets.clear();
                document.querySelectorAll('.bet-item').forEach(i => i.classList.remove('active'));
                document.getElementById('selected-count').innerText = 0;
                alert('下单成功');
            } else alert(res.message);
        }

        function toggleChat() { const el = document.getElementById('chat-overlay'); el.classList.toggle('hidden'); if(!el.classList.contains('hidden')) loadChat(); }
        async function loadChat() {
            const res = await fetch('/api/chat.php').then(r => r.json());
            if(res.success) {
                const box = document.getElementById('chat-box');
                box.innerHTML = res.data.map(m => `<div class="flex ${m.sender_id == 0 ? '' : 'justify-end'}"><div class="max-w-[85%] p-4 text-sm font-bold shadow-sm ${m.sender_id == 0 ? 'chat-bubble-admin' : 'chat-bubble-user'}">${m.message}<p class="text-[8px] mt-1 opacity-50 uppercase text-right">${m.created_at.split(' ')[1]}</p></div></div>`).join('');
                box.scrollTop = box.scrollHeight;
            }
        }
        async function sendChatMessage() {
            const input = document.getElementById('chat-input'); const msg = input.value; if(!msg) return;
            await fetch('/api/chat.php?action=send', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: msg}) });
            input.value = ''; loadChat();
        }

        function closeAnnounce() { localStorage.setItem('announced', 'true'); document.getElementById('announce-modal').classList.add('hidden'); }
        refreshData(); setInterval(refreshData, 8000);
    </script>
</body>
</html>
