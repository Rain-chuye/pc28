<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>游戏房间 - PC28</title>
    <script src="https://cdn.tailwindcss.com">
        function toggleChat() {
            const overlay = document.getElementById('chat-overlay');
            overlay.classList.toggle('hidden');
            if(!overlay.classList.contains('hidden')) loadChatMessages();
        }

        async function loadChatMessages() {
            const res = await fetch('/api/chat.php').then(r => r.json());
            if(res.success) {
                const box = document.getElementById('chat-box');
                box.innerHTML = res.data.map(m => `
                    <div class="flex ${m.sender_id == 1 ? '' : 'justify-end'}">
                        <div class="max-w-[85%] ${m.sender_id == 1 ? 'bg-white border border-slate-100 text-slate-800' : 'bg-blue-600 text-white shadow-blue-100'} p-4 rounded-2xl shadow-sm text-sm font-bold">
                            ${m.message}
                        </div>
                    </div>
                `).join('');
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value;
            if(!msg) return;
            await fetch('/api/chat.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            input.value = '';
            loadChatMessages();
        }

    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        dark: { DEFAULT: '#f8fafc', light: '#ffffff', border: '#e2e8f0' }
                    }
                }
            }
        }

            const overlay = document.getElementById('chat-overlay');
            overlay.classList.toggle('hidden');
            if(!overlay.classList.contains('hidden')) loadChatMessages();
        }

        async function loadChatMessages() {

                        <div class="max-w-[85%] ${m.sender_id == 1 ? 'bg-white border border-slate-100 text-slate-800' : 'bg-blue-600 text-white shadow-blue-100'} p-4 rounded-2xl shadow-sm text-sm font-bold">

                        </div>
                    </div>

            const input = document.getElementById('chat-input');

    <style>
        body { background-color: #f1f5f9; color: #334155; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        .ball { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; background: #ffffff; border: 1px solid #e2e8f0; }
        .ball-sum { background: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .bet-item { background: #ffffff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; text-align: center; transition: all 0.2s; cursor: pointer; }
        .bet-item.active { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 900; }
        .mipai-overlay { position: absolute; inset: -2px; background: #cbd5e1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; transition: 0.5s; }
        .revealed .mipai-overlay { transform: translateY(-100%) rotate(30deg); opacity: 0; pointer-events: none; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
    </style>
</head>
<body class="pb-32">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md p-4 flex justify-between items-center border-b border-slate-200">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center"><i class="fas fa-chevron-left text-xs text-slate-400"></i></button>
            <div>
                <h1 id="room-title" class="text-[13px] font-black uppercase text-slate-400">Canada 28</h1>
                <p id="issue-display" class="text-[10px] font-bold text-slate-800">获取中...</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="quickCheckScore()" class="bg-blue-600 text-white text-[10px] px-3 py-1.5 rounded-lg font-black shadow-lg shadow-blue-100">查分</button>
            <button onclick="toggleChat()" class="bg-blue-50 text-blue-600 text-[10px] px-3 py-1.5 rounded-lg font-black border border-blue-100">客服</button>
            <button onclick="openReturnModal()" class="bg-white border border-slate-200 text-slate-500 text-[10px] px-3 py-1.5 rounded-lg font-black">回分</button>
        </div>
    </header>

    <main class="p-4 space-y-5">
        <div class="bg-white p-6 rounded-3xl border border-slate-200 relative overflow-hidden shadow-sm">
            <div class="flex flex-col items-center gap-4 relative z-10">
                <div class="flex items-center gap-3">
                    <div class="num-ball ball" id="ball-0">?</div>
                    <i class="fas fa-plus text-[10px] text-slate-300"></i>
                    <div class="num-ball ball" id="ball-1">?</div>
                    <i class="fas fa-plus text-[10px] text-slate-300"></i>
                    <div class="num-ball ball" id="ball-2">?</div>
                    <i class="fas fa-equals text-[10px] text-slate-300"></i>
                    <div class="mipai-container relative w-10 h-10">
                        <div class="mipai-overlay" onclick="this.parentElement.classList.add('revealed')">
                            <i class="fas fa-fingerprint text-slate-500 text-xs"></i>
                            <span class="text-[6px] text-slate-400 mt-0.5">咪牌</span>
                        </div>
                        <div id="total-result" class="ball ball-sum">?</div>
                    </div>
                </div>
                <div id="timer-display" class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50 px-4 py-1.5 rounded-full border border-slate-100">
                    Next Draw: <span class="text-blue-600 font-mono">00:00</span>
                </div>
            </div>
        </div>

        <div class="h-8 overflow-hidden bg-blue-50/50 rounded-xl px-4 border border-blue-100">
            <div id="live-feed-container" class="transition-transform duration-500"></div>
        </div>

        <div class="flex gap-8 border-b border-slate-200 px-2">
            <button onclick="switchTab('basic')" id="tab-basic" class="pb-3 text-xs font-bold tab-active">常用玩法</button>
            <button onclick="switchTab('special')" id="tab-special" class="pb-3 text-xs font-bold text-slate-400">组合特型</button>
            <button onclick="switchTab('numbers')" id="tab-numbers" class="pb-3 text-xs font-bold text-slate-400">特码定位</button>
            <button onclick="switchTab('history')" id="tab-history" class="pb-3 text-xs font-bold text-slate-400">开奖历史</button>
        </div>

        <div id="pane-basic" class="grid grid-cols-2 gap-3">
            <div class="bet-item" onclick="toggleBet(this, 'big')">大 <span class="text-[10px] opacity-40 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'small')">小 <span class="text-[10px] opacity-40 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'single')">单 <span class="text-[10px] opacity-40 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'double')">双 <span class="text-[10px] opacity-40 ml-1">2.00</span></div>
        </div>

        <div id="pane-special" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="bet-item" onclick="toggleBet(this, 'big_single')">大单 <span class="text-[10px] opacity-40 ml-1">3.80</span></div>
                <div class="bet-item" onclick="toggleBet(this, 'big_double')">大双 <span class="text-[10px] opacity-40 ml-1">3.80</span></div>
                <div class="bet-item" onclick="toggleBet(this, 'small_single')">小单 <span class="text-[10px] opacity-40 ml-1">3.80</span></div>
                <div class="bet-item" onclick="toggleBet(this, 'small_double')">小双 <span class="text-[10px] opacity-40 ml-1">3.80</span></div>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div class="bet-item !p-3" onclick="toggleBet(this, 'triple')"><p class="text-xs font-black">豹子</p><p class="text-[9px] text-slate-400">66x</p></div>
                <div class="bet-item !p-3" onclick="toggleBet(this, 'straight')"><p class="text-xs font-black">顺子</p><p class="text-[9px] text-slate-400">10x</p></div>
                <div class="bet-item !p-3" onclick="toggleBet(this, 'pair')"><p class="text-xs font-black">对子</p><p class="text-[9px] text-slate-400">3x</p></div>
            </div>
        </div>

        <div id="pane-numbers" class="hidden grid grid-cols-5 gap-2">
            <script>
                for(let i=0; i<=27; i++) {
                    document.write(`<div class="bet-item !p-2 text-sm font-bold !rounded-lg" onclick="toggleBet(this, '${i}')">${i}</div>`);
                }

        function toggleChat() {
            const overlay = document.getElementById('chat-overlay');
            overlay.classList.toggle('hidden');
            if(!overlay.classList.contains('hidden')) loadChatMessages();
        }

        async function loadChatMessages() {
            const res = await fetch('/api/chat.php').then(r => r.json());
            if(res.success) {
                const box = document.getElementById('chat-box');
                box.innerHTML = res.data.map(m => `
                    <div class="flex ${m.sender_id == 1 ? '' : 'justify-end'}">
                        <div class="max-w-[85%] ${m.sender_id == 1 ? 'bg-white border border-slate-100 text-slate-800' : 'bg-blue-600 text-white shadow-blue-100'} p-4 rounded-2xl shadow-sm text-sm font-bold">
                            ${m.message}
                        </div>
                    </div>
                `).join('');
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value;
            if(!msg) return;
            await fetch('/api/chat.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            input.value = '';
            loadChatMessages();
        }

    </script>
        </div>

        <div id="pane-history" class="hidden space-y-2"></div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/95 backdrop-blur-xl border-t border-slate-200 z-[60]">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <div class="flex-1 bg-slate-50 rounded-xl border border-slate-200 flex items-center px-4">
                <input type="number" id="bet-amount" class="w-full bg-transparent py-3.5 outline-none text-sm font-bold text-blue-600" placeholder="下注金额">
            </div>
            <button onclick="submitBets()" class="bg-blue-600 text-white px-8 py-3.5 rounded-xl font-black text-sm shadow-lg shadow-blue-100 active:scale-95 transition-all">
                确认下单 (<span id="selected-count">0</span>)
            </button>
        </div>
    </div>

    <!-- Modals -->
    <div id="return-modal" class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-xs rounded-3xl p-8 border border-slate-200 shadow-2xl">
            <h2 class="text-lg font-black text-center mb-6 text-slate-800">快速回分</h2>
            <div class="space-y-4">
                <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
                    <p class="text-[10px] text-slate-400 mb-2 uppercase font-black">金额 (最低 50)</p>
                    <input type="number" id="return-amount" class="w-full bg-transparent text-2xl font-black outline-none text-blue-600" placeholder="0">
                </div>
                <div class="flex gap-2">
                    <button onclick="closeReturnModal()" class="flex-1 py-4 bg-slate-100 rounded-xl text-xs font-bold text-slate-500">取消</button>
                    <button onclick="submitScoreReturn()" class="flex-1 py-4 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-lg">提交</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-10 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const oddsMode = params.get('room') || 'low';
        let selectedBets = new Set();
        let currentIssue = '';
        let lastLotteryId = '';
        let countdownTimer = null;
        let timeLeft = 0;

        function showToast(m, t='info') {
            const el = document.createElement('div');
            el.className = `px-6 py-2.5 rounded-full text-[11px] font-black shadow-2xl animate-bounce ${t==='success' ? 'bg-green-500 text-white' : 'bg-blue-600 text-white'}`;
            el.innerText = m;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function startCountdown() {
            if(countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                if(timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    document.getElementById('timer-display').innerHTML = '<span class="text-red-500 animate-pulse">正在开奖...</span>';
                    return;
                }
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                const timeStr = `${m}:${s < 10 ? '0' : ''}${s}`;
                if(timeLeft <= 15) {
                    document.getElementById('timer-display').innerHTML = `<span class="text-red-600 font-black">已封盘</span> <span class="ml-2 text-slate-400 font-mono">${timeStr}</span>`;
                } else {
                    document.getElementById('timer-display').innerHTML = `Next Draw: <span class="text-blue-600 font-mono font-black">${timeStr}</span>`;
                }
            }, 1000);
        }

        function switchTab(t) {
            ['basic', 'special', 'numbers', 'history'].forEach(p => {
                document.getElementById(`pane-${p}`).classList.add('hidden');
                document.getElementById(`tab-${p}`).classList.remove('tab-active');
                document.getElementById(`tab-${p}`).classList.add('text-slate-400');
            });
            document.getElementById(`pane-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('tab-active');
            document.getElementById(`tab-${t}`).classList.remove('text-slate-400');
            if(t === 'history') loadHistory();
        }

        function toggleBet(el, type) {
            if(selectedBets.has(type)) { selectedBets.delete(type); el.classList.remove('active'); }
            else { selectedBets.add(type); el.classList.add('active'); }
            document.getElementById('selected-count').innerText = selectedBets.size;
        }

        async function submitBets() {
            const amount = document.getElementById('bet-amount').value;
            if (selectedBets.size === 0) return showToast('选择玩法');
            if (!amount || amount < 2) return showToast('最小 2');
            const bets = Array.from(selectedBets).map(t => ({ play_type: t, amount: parseFloat(amount) }));
            try {
                const res = await fetch('/api/bet.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bets, odds_type: oddsMode, issue_no: currentIssue })
                }).then(r => r.json());
                if(res.success) {
                    showToast('下单成功', 'success');
                    selectedBets.clear();
                    document.querySelectorAll('.bet-item').forEach(i => i.classList.remove('active'));
                    document.getElementById('selected-count').innerText = 0;
                } else showToast(res.message);
            } catch (e) { showToast('网络连接超时'); }
        }

        async function refreshData() {
            try {
                const res = await fetch('/api/lottery.php').then(r => r.json());
                if(res.latest) {
                    currentIssue = res.latest.issue_no;
                    document.getElementById('issue-display').innerText = `第 ${currentIssue} 期正在开放`;
                    const nums = res.latest.numbers.split(',');
                    document.getElementById('ball-0').innerText = nums[0];
                    document.getElementById('ball-1').innerText = nums[1];
                    document.getElementById('ball-2').innerText = nums[2];
                    document.getElementById('total-result').innerText = res.latest.total_sum;
                    if(lastLotteryId !== currentIssue) {
                        lastLotteryId = currentIssue;
                        document.querySelector('.mipai-container').classList.remove('revealed');
                        timeLeft = res.countdown;
                        startCountdown();
                    }
                }
                const feed = await fetch('/api/live_bets.php').then(r => r.json());
                if(feed.data && feed.data.length > 0) {
                    document.getElementById('live-feed-container').innerHTML = feed.data.slice(0, 5).map(b => `
                        <p class="text-[9px] text-slate-400 py-2 font-bold truncate">用户 ${b.username.substring(0,3)}*** 下注 ${b.play_type} ¥${Math.floor(b.bet_amount)}</p>
                    `).join('');
                }
            } catch(e) {}
        }

        async function loadHistory() {
            const res = await fetch('/api/lottery.php?limit=20').then(r => r.json());
            if(res.history) {
                document.getElementById('pane-history').innerHTML = res.history.map(h => `
                    <div class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-100">
                        <span class="text-[10px] text-slate-400 font-bold">#${h.issue_no}</span>
                        <div class="flex items-center gap-4">
                            <span class="text-[10px] px-2 py-0.5 bg-slate-50 rounded text-slate-500 font-bold">${h.numbers}</span>
                            <span class="text-xs font-black text-blue-600 w-6 text-right">${h.total_sum}</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function quickCheckScore() {
            const res = await fetch('/api/quick_finance.php?action=check').then(r => r.json());
            if(res.success) showToast(`当前余额: ¥${parseFloat(res.balance).toLocaleString()}`, 'success');
        }

        function openReturnModal() { document.getElementById('return-modal').classList.remove('hidden'); }
        function closeReturnModal() { document.getElementById('return-modal').classList.add('hidden'); }

        async function submitScoreReturn() {
            const amount = document.getElementById('return-amount').value;
            if(!amount || amount < 50) return showToast('回分最低 50');
            const res = await fetch('/api/quick_finance.php?action=return', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({amount: parseFloat(amount)})
            }).then(r => r.json());
            showToast(res.message, res.success ? 'success' : 'info');
            if(res.success) closeReturnModal();
        }

        setInterval(refreshData, 5000);
        refreshData();

        function toggleChat() {
            const overlay = document.getElementById('chat-overlay');
            overlay.classList.toggle('hidden');
            if(!overlay.classList.contains('hidden')) loadChatMessages();
        }

        async function loadChatMessages() {
            const res = await fetch('/api/chat.php').then(r => r.json());
            if(res.success) {
                const box = document.getElementById('chat-box');
                box.innerHTML = res.data.map(m => `
                    <div class="flex ${m.sender_id == 1 ? '' : 'justify-end'}">
                        <div class="max-w-[85%] ${m.sender_id == 1 ? 'bg-white border border-slate-100 text-slate-800' : 'bg-blue-600 text-white shadow-blue-100'} p-4 rounded-2xl shadow-sm text-sm font-bold">
                            ${m.message}
                        </div>
                    </div>
                `).join('');
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value;
            if(!msg) return;
            await fetch('/api/chat.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            input.value = '';
            loadChatMessages();
        }

    </script>

    <!-- Chat Overlay -->
    <div id="chat-overlay" class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm hidden flex flex-col p-6">
        <div class="flex-1 bg-white rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-blue-600 p-5 flex justify-between items-center text-white">
                <h3 class="font-black text-sm uppercase tracking-widest">Live Support</h3>
                <button onclick="toggleChat()"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50/50"></div>
            <div class="p-4 bg-white border-t border-slate-100 flex gap-3">
                <input type="text" id="chat-input" class="flex-1 bg-slate-50 border-none rounded-xl px-5 outline-none font-bold text-sm" placeholder="输入您的问题...">
                <button onclick="sendChatMessage()" class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-lg shadow-blue-100"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

</body>
</html>
