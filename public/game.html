<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加拿大至尊 - 东爷国际</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #2563eb; }
        body { background-color: #f8fafc; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; -webkit-overflow-scrolling: touch; }

        .scratch-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 1.5rem; position: relative; overflow: hidden; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 4px; border: 1px solid rgba(255,255,255,0.1); }
        #scratch-canvas { position: absolute; inset: 0; z-index: 10; cursor: crosshair; touch-action: none; border-radius: 1.5rem; }

        .ball { width: 28px; height: 28px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; border: 1px solid #e2e8f0; color: #1e293b; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .ball-sum { background: var(--primary); color: white; border-color: transparent; }
        .ball-13-14 { background: #dc2626; }

        .chat-container { background: white; border-radius: 2rem 2rem 0 0; box-shadow: 0 -10px 25px rgba(0,0,0,0.03); flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .bet-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #f1f5f9; z-index: 500; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); display: flex; flex-direction: column; border-radius: 2rem 2rem 0 0; box-shadow: 0 -15px 30px rgba(0,0,0,0.1); }
        .bet-panel.active { transform: translateY(0); }

        .bet-item { background: #f8fafc; border-radius: 1rem; padding: 12px 4px; text-align: center; cursor: pointer; border: 1.5px solid #f1f5f9; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .bet-item.active { border-color: var(--primary); background: #eff6ff; }
        .bet-item:active { transform: scale(0.95); opacity: 0.8; }

        .tag { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 100px; color: white; }
        .tag-win { background: #2563eb; }
        .tag-special { background: #dc2626; }
        .tag-extreme { background: #ea580c; }

        #win-popup { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); display: none; flex-direction: column; align-items: center; justify-content: center; }
        .win-card { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); padding: 3rem; border-radius: 2.5rem; text-align: center; color: white; box-shadow: 0 0 50px rgba(217,119,6,0.3); }

        .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 1.25rem; font-size: 11px; font-weight: 700; line-height: 1.5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col">
    <div id="win-popup" onclick="this.style.display='none'">
        <div class="win-card animate-in zoom-in duration-300">
            <p class="text-4xl font-black mb-2">💰 恭喜中奖</p>
            <p class="text-2xl font-black bg-white/20 py-2 px-8 rounded-full inline-block">¥ <span id="win-amount-val">0.00</span></p>
        </div>
    </div>

    <header class="p-4 space-y-3 shrink-0 bg-white border-b border-slate-50 z-[200]">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="history.back()" class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 border border-slate-100"><i class="fas fa-chevron-left text-xs"></i></button>
                <div>
                    <p id="room-display" class="font-black text-sm text-slate-800 tracking-tight"></p>
                    <p id="issue-display" class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-0.5">ISSUE: --</p>
                </div>
            </div>
            <div id="user-balance" class="text-[10px] font-black text-blue-600 bg-blue-50/50 px-4 py-2 rounded-xl border border-blue-100">¥ 0.00</div>
        </div>

        <div class="scratch-card">
            <canvas id="scratch-canvas"></canvas>
            <div class="scratch-content">
                <div class="flex items-center gap-2 mb-2">
                    <div class="ball" id="ball-0">-</div>
                    <i class="fas fa-plus text-[8px] text-slate-500"></i>
                    <div class="ball" id="ball-1">-</div>
                    <i class="fas fa-plus text-[8px] text-slate-500"></i>
                    <div class="ball" id="ball-2">-</div>
                    <i class="fas fa-equals text-[8px] text-slate-500"></i>
                    <div class="ball ball-sum" id="total-result">-</div>
                </div>
                <div id="result-tags" class="flex gap-1.5 flex-wrap justify-center"></div>
            </div>
        </div>
        <div id="timer-display" class="text-center text-[9px] font-black text-slate-400 uppercase tracking-widest">--:--</div>
    </header>

    <main class="chat-container">
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/30 no-scrollbar"></div>
        <div class="p-5 bg-white border-t border-slate-50 grid grid-cols-4 gap-3 shrink-0">
            <button onclick="toggleBetPanel()" class="col-span-2 h-14 bg-blue-600 text-white rounded-2xl font-black text-xs uppercase shadow-lg shadow-blue-100"><i class="fas fa-dice mr-2"></i> 立即下注</button>
            <button onclick="location.href='/recharge.html'" class="h-14 bg-slate-50 text-slate-400 rounded-2xl font-black text-[10px] border border-slate-100"><i class="fas fa-plus-circle mb-1 block"></i> 充值</button>
            <button onclick="location.href='/withdraw.html'" class="h-14 bg-slate-50 text-slate-400 rounded-2xl font-black text-[10px] border border-slate-100"><i class="fas fa-university mb-1 block"></i> 回分</button>
        </div>
    </main>

    <div id="bet-panel" class="bet-panel h-[70vh]">
        <div class="p-5 flex justify-between items-center border-b border-slate-50">
            <h4 class="text-sm font-black text-slate-800">快捷下注</h4>
            <button onclick="toggleBetPanel()" class="text-slate-300"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex p-4 gap-2 bg-slate-50 border-b border-slate-100">
            <button id="btab-basic" onclick="switchBetTab('basic')" class="flex-1 py-2 rounded-lg font-black text-[10px] uppercase bg-white text-blue-600 shadow-sm">大小单双</button>
            <button id="btab-special" onclick="switchBetTab('special')" class="flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400">特殊组合</button>
            <button id="btab-numbers" onclick="switchBetTab('numbers')" class="flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400">数字直选</button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 no-scrollbar">
            <div id="bpane-basic" class="grid grid-cols-2 gap-3">
                <div class="bet-item" onclick="toggleBet(this, 'big')"><p class="text-sm font-black">大</p><p id="odds-big" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
                <div class="bet-item" onclick="toggleBet(this, 'small')"><p class="text-sm font-black">小</p><p id="odds-small" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
                <div class="bet-item" onclick="toggleBet(this, 'single')"><p class="text-sm font-black">单</p><p id="odds-single" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
                <div class="bet-item" onclick="toggleBet(this, 'double')"><p class="text-sm font-black">双</p><p id="odds-double" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
            </div>
            <div id="bpane-special" class="hidden grid grid-cols-2 gap-3">
                <div class="bet-item" onclick="toggleBet(this, 'big_single')"><p class="text-sm font-black">大单</p><p id="odds-big_single" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
                <div class="bet-item" onclick="toggleBet(this, 'big_double')"><p class="text-sm font-black">大双</p><p id="odds-big_double" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
                <div class="bet-item" onclick="toggleBet(this, 'small_single')"><p class="text-sm font-black">小单</p><p id="odds-small_single" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
                <div class="bet-item" onclick="toggleBet(this, 'small_double')"><p class="text-sm font-black">小双</p><p id="odds-small_double" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
                <div class="bet-item" onclick="toggleBet(this, 'triple')"><p class="text-sm font-black">豹子</p><p id="odds-triple" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
                <div class="bet-item" onclick="toggleBet(this, 'straight')"><p class="text-sm font-black">顺子</p><p id="odds-straight" class="text-[9px] font-bold text-slate-400 mt-1">--</p></div>
            </div>
            <div id="bpane-numbers" class="hidden grid grid-cols-4 gap-2"></div>
        </div>
        <div class="p-6 bg-slate-50 border-t border-slate-100">
            <div class="bg-white p-4 rounded-2xl flex items-center shadow-sm mb-4">
                <span class="text-[10px] font-black text-slate-300 mr-4">下注金额</span>
                <input type="number" id="bet-amount" class="w-full font-black text-slate-800 outline-none text-base" value="10">
            </div>
            <button onclick="submitBets()" class="w-full h-14 bg-blue-600 text-white rounded-2xl font-black text-xs shadow-lg shadow-blue-100">确认下单 (<span id="selected-count">0</span>)</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room') || 'high';
        document.getElementById('room-display').innerText = room === 'high' ? '东爷国际至尊房' : '东爷国际标准房';

        let selectedBets = new Set();
        let betIssue = ''; let globalOdds = {}; let timeLeft = 0; let lastResultId = '';

        const canvas = document.getElementById('scratch-canvas'); const ctx = canvas.getContext('2d');
        function initScratch() {
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.fillStyle = '#334155'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white'; ctx.font = '900 10px Inter'; ctx.textAlign = 'center'; ctx.fillText('划动手势揭晓结果', canvas.width/2, canvas.height/2 + 4);
            ctx.globalCompositeOperation = 'destination-out';
        }
        function handleScratch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.filter = 'blur(4px)'; ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width - x, y, 20, 0, Math.PI * 2); ctx.fill();
        }
        canvas.addEventListener('mousemove', handleScratch); canvas.addEventListener('touchmove', handleScratch, {passive: false});

        async function refreshData() {
            try {
                const res = await fetch('/api/lottery.php').then(r => r.json());
                const userRes = await fetch('/api/user_info.php').then(r => r.json());
                if(res.latest) {
                    if(lastResultId && lastResultId !== res.latest.issue_no) {
                        const winRes = await fetch('/api/bet_history.php?issue=' + lastResultId).then(r => r.json());
                        if(winRes.total_win > 0) showWinAnimation(winRes.total_win);
                        lastResultId = res.latest.issue_no; initScratch();
                    } else if(!lastResultId) { lastResultId = res.latest.issue_no; initScratch(); }
                    betIssue = res.bet_issue_no; document.getElementById('issue-display').innerText = `ISSUE: ${betIssue}`;
                    const nums = res.latest.numbers.split(',').map(n => parseInt(n)); const sum = parseInt(res.latest.total_sum);
                    document.getElementById('ball-0').innerText = nums[0]; document.getElementById('ball-1').innerText = nums[1]; document.getElementById('ball-2').innerText = nums[2];
                    const sumBall = document.getElementById('total-result'); sumBall.innerText = sum;
                    if(sum === 13 || sum === 14) sumBall.classList.add('ball-13-14'); else sumBall.classList.remove('ball-13-14');

                    const tags = []; const isBig = sum >= 14; const isSingle = sum % 2 != 0;
                    tags.push(isBig ? '大' : '小'); tags.push(isSingle ? '单' : '双');
                    if(nums[0] === nums[1] && nums[1] === nums[2]) tags.push('豹子');
                    if(sum >= 22) tags.push('极大'); if(sum <= 5) tags.push('极小');
                    document.getElementById('result-tags').innerHTML = tags.map(t => `<span class="tag ${t.length > 1 ? 'tag-extreme' : 'tag-win'}">${t}</span>`).join('');
                    timeLeft = res.countdown; startCountdown();
                }
                if(userRes.success) document.getElementById('user-balance').innerText = `¥ ${parseFloat(userRes.user.balance).toLocaleString()}`;
                if(res.odds) { globalOdds = res.odds; renderOdds(); }
                loadMsgs();
            } catch(e) {}
        }

        function showWinAnimation(amount) {
            document.getElementById('win-amount-val').innerText = amount.toLocaleString();
            document.getElementById('win-popup').style.display = 'flex';
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        function renderOdds() {
            const keys = {'big':'odds-big','small':'odds-small','single':'odds-single','double':'odds-double','big_single':'odds-big_single','big_double':'odds-big_double','small_single':'odds-small_single','small_double':'odds-small_double','triple':'odds-triple','straight':'odds-straight','pair':'odds-pair','extreme_big':'odds-extreme_big','extreme_small':'odds-extreme_small'};
            Object.entries(keys).forEach(([k, id]) => { if(globalOdds[k]) document.getElementById(id).innerText = globalOdds[k][room].toFixed(2); });
            const pane = document.getElementById('bpane-numbers'); pane.innerHTML = '';
            for(let i=0; i<=27; i++) {
                const type = i.toString(); const odds = globalOdds[type] ? globalOdds[type][room] : 12.0;
                const div = document.createElement('div'); div.className = 'bet-item'; div.onclick = () => toggleBet(div, type);
                div.innerHTML = `<p class="text-xs font-black">${i}</p><p class="text-[8px] font-bold text-slate-400 mt-1">${odds.toFixed(1)}</p>`;
                if(selectedBets.has(type)) div.classList.add('active'); pane.appendChild(div);
            }
        }
        function startCountdown() {
            if(window.timer) clearInterval(window.timer);
            window.timer = setInterval(() => {
                if(timeLeft <= 0) return clearInterval(window.timer);
                timeLeft--;
                const m = Math.floor(timeLeft/60); const s = timeLeft%60;
                const timeStr = `${m}:${s<10?'0':''}${s}`;
                document.getElementById('timer-display').innerHTML = timeLeft <= 20 ? `<span class="text-rose-500 font-black">已封盘</span> <span class="ml-1">${timeStr}</span>` : `距离开奖: <span class="text-blue-600 font-black">${timeStr}</span>`;
            }, 1000);
        }
        async function loadMsgs() {
            const res = await fetch(`/api/group_chat.php?room=${room}`).then(r => r.json());
            if(res.success) {
                const box = document.getElementById('chat-box'); const wasAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;
                box.innerHTML = res.data.map(m => {
                    const isRobot = m.user_id == 0;
                    return `<div class="flex items-start gap-3"><img src="${m.avatar || '/assets/default_avatar.png'}" class="w-8 h-8 rounded-xl flex-shrink-0" onerror="this.src='/assets/default_avatar.png'"><div class="flex-1"><p class="text-[8px] font-black uppercase text-slate-400 mb-1">${m.username}</p><div class="chat-bubble inline-block bg-white border border-slate-100 shadow-sm">${m.message.replace(/\n/g, '<br>')}</div></div></div>`;
                }).join('');
                if(wasAtBottom) box.scrollTop = box.scrollHeight;
            }
        }
        function toggleBetPanel() { document.getElementById('bet-panel').classList.toggle('active'); }
        function switchBetTab(t) {
            ['basic','special','numbers'].forEach(p => { document.getElementById('bpane-'+p).classList.add('hidden'); document.getElementById('btab-'+p).className = 'flex-1 py-2 rounded-lg font-black text-[10px] uppercase text-slate-400'; });
            document.getElementById('bpane-'+t).classList.remove('hidden'); document.getElementById('btab-'+t).className = 'flex-1 py-2 rounded-lg font-black text-[10px] uppercase bg-white text-blue-600 shadow-sm';
        }
        function toggleBet(el, type) { if(selectedBets.has(type)) { selectedBets.delete(type); el.classList.remove('active'); } else { selectedBets.add(type); el.classList.add('active'); } document.getElementById('selected-count').innerText = selectedBets.size; }
        async function submitBets() {
            const amount = document.getElementById('bet-amount').value;
            if (selectedBets.size === 0) return alert('请选择玩法');
            const bets = Array.from(selectedBets).map(t => ({ play_type: t, amount: parseFloat(amount) }));
            const res = await fetch('/api/bet.php', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ bets, odds_type: room, issue_no: betIssue }) }).then(r => r.json());
            if(res.success) { selectedBets.clear(); document.querySelectorAll('.bet-item').forEach(i => i.classList.remove('active')); document.getElementById('selected-count').innerText = 0; toggleBetPanel(); refreshData(); } else alert(res.message);
        }
        window.onload = () => { initScratch(); refreshData(); setInterval(refreshData, 3000); };
    </script>
</body>
</html>
