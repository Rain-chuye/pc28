<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>游戏房间 - PC28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#EAB308',
                        dark: { DEFAULT: '#0A0A0A', light: '#141414', border: '#1F1F1F' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; color: #E5E5E5; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        .ball { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; background: #141414; border: 1px solid #1F1F1F; }
        .ball-sum { background: #EAB308; color: #000; border-color: #EAB308; box-shadow: 0 0 15px rgba(234, 179, 8, 0.3); }
        .bet-item { background: #141414; border: 1px solid #1F1F1F; padding: 12px; border-radius: 12px; text-align: center; transition: all 0.2s; }
        .bet-item.active { background: #EAB308; color: #000; border-color: #EAB308; font-weight: 900; }
        .mipai-overlay { position: absolute; inset: -2px; background: #1F1F1F; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; cursor: pointer; transition: 0.5s; }
        .revealed .mipai-overlay { transform: translateY(-100%) rotate(30deg); opacity: 0; pointer-events: none; }
        .tab-active { color: #EAB308; border-bottom: 2px solid #EAB308; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="pb-32">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md p-4 flex justify-between items-center border-b border-dark-border">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="w-8 h-8 rounded-full bg-dark-light flex items-center justify-center border border-dark-border"><i class="fas fa-chevron-left text-xs"></i></button>
            <div>
                <h1 id="room-title" class="text-[13px] font-bold">加拿大 28</h1>
                <p id="issue-display" class="text-[10px] text-slate-500">正在获取期号...</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="quickCheckScore()" class="bg-primary/10 text-primary text-[10px] px-3 py-1.5 rounded-full font-bold border border-primary/20">查分</button>
            <button onclick="openReturnModal()" class="bg-white/5 text-slate-300 text-[10px] px-3 py-1.5 rounded-full font-bold border border-white/10">回分</button>
        </div>
    </header>

    <main class="p-4 space-y-5">
        <!-- Results -->
        <div class="bg-dark-light p-6 rounded-3xl border border-dark-border relative overflow-hidden">
            <div class="flex flex-col items-center gap-4 relative z-10">
                <div class="flex items-center gap-3">
                    <div class="num-ball ball">?</div>
                    <i class="fas fa-plus text-[10px] text-slate-600"></i>
                    <div class="num-ball ball">?</div>
                    <i class="fas fa-plus text-[10px] text-slate-600"></i>
                    <div class="num-ball ball">?</div>
                    <i class="fas fa-equals text-[10px] text-slate-600"></i>
                    <div class="mipai-container relative w-10 h-10">
                        <div class="mipai-overlay" onclick="this.parentElement.classList.add('revealed')">
                            <i class="fas fa-fingerprint text-primary text-xs"></i>
                            <span class="text-[6px] text-primary mt-0.5">咪牌</span>
                        </div>
                        <div id="total-result" class="ball ball-sum">?</div>
                    </div>
                </div>
                <div id="timer-display" class="text-[11px] font-bold text-slate-500 bg-black/40 px-4 py-1.5 rounded-full border border-white/5">
                    距离下期开奖还有 <span class="text-primary tabular-nums">00:00</span>
                </div>
            </div>
        </div>

        <!-- Ticker -->
        <div class="h-6 overflow-hidden bg-primary/5 rounded-lg px-3 border border-primary/10">
            <div id="live-feed-container" class="transition-transform duration-500">
                <p class="text-[10px] text-primary/70 py-1 truncate">正在同步全球实时投注数据...</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-6 border-b border-dark-border px-2">
            <button onclick="switchTab('basic')" id="tab-basic" class="pb-3 text-xs font-bold tab-active">双面</button>
            <button onclick="switchTab('special')" id="tab-special" class="pb-3 text-xs font-bold text-slate-500">组合</button>
            <button onclick="switchTab('numbers')" id="tab-numbers" class="pb-3 text-xs font-bold text-slate-500">特码</button>
            <button onclick="switchTab('history')" id="tab-history" class="pb-3 text-xs font-bold text-slate-500">开奖</button>
        </div>

        <!-- Betting Areas -->
        <div id="pane-basic" class="grid grid-cols-2 gap-3">
            <div class="bet-item" onclick="toggleBet(this, 'big')">大 <span class="text-[10px] opacity-40 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'small')">小 <span class="text-[10px] opacity-40 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'single')">单 <span class="text-[10px] opacity-40 ml-1">2.00</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'double')">双 <span class="text-[10px] opacity-40 ml-1">2.00</span></div>
        </div>

        <div id="pane-special" class="hidden grid grid-cols-2 gap-3">
            <div class="bet-item" onclick="toggleBet(this, 'big_single')">大单 <span class="text-[10px] opacity-40 ml-1">3.8</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'big_double')">大双 <span class="text-[10px] opacity-40 ml-1">3.8</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'small_single')">小单 <span class="text-[10px] opacity-40 ml-1">3.8</span></div>
            <div class="bet-item" onclick="toggleBet(this, 'small_double')">小双 <span class="text-[10px] opacity-40 ml-1">3.8</span></div>
        </div>

        <div id="pane-numbers" class="hidden grid grid-cols-5 gap-2">
            <script>
                for(let i=0; i<=27; i++) {
                    document.write(`<div class="bet-item !p-2 text-sm" onclick="toggleBet(this, '${i}')">${i}</div>`);
                }
            </script>
        </div>

        <div id="pane-history" class="hidden space-y-2" id="history-list"></div>
    </main>

    <!-- Footer Bar -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-dark-light/95 backdrop-blur-xl border-t border-dark-border z-[60]">
        <div class="max-w-md mx-auto flex items-center gap-3">
            <div class="flex-1 bg-black rounded-xl border border-dark-border flex items-center px-4">
                <span class="text-[10px] text-slate-600 font-bold mr-2">投注</span>
                <input type="number" id="bet-amount" class="w-full bg-transparent py-3.5 outline-none text-sm font-bold text-primary" placeholder="输入金额">
            </div>
            <button onclick="submitBets()" class="bg-primary text-black px-8 py-3.5 rounded-xl font-black text-sm shadow-lg shadow-primary/10 active:scale-95 transition-all">
                确认下单 (<span id="selected-count">0</span>)
            </button>
        </div>
    </div>

    <!-- Modals -->
    <div id="return-modal" class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="bg-dark-light w-full max-w-xs rounded-3xl p-8 border border-white/5 shadow-2xl">
            <h2 class="text-lg font-bold text-center mb-6">快速回分</h2>
            <div class="space-y-4">
                <div class="bg-black rounded-xl p-4 border border-white/5">
                    <p class="text-[10px] text-slate-500 mb-2 uppercase font-bold">提取金额</p>
                    <input type="number" id="return-amount" class="w-full bg-transparent text-2xl font-black outline-none text-primary" placeholder="0">
                </div>
                <div class="flex gap-2">
                    <button onclick="closeReturnModal()" class="flex-1 py-4 bg-white/5 rounded-xl text-xs font-bold">取消</button>
                    <button onclick="submitScoreReturn()" class="flex-1 py-4 bg-primary text-black rounded-xl text-xs font-bold">提交</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const oddsMode = params.get('room') || 'low';
        let selectedBets = new Set();
        let currentIssue = '';
        let lastLotteryId = '';

        function showToast(msg, type='info') {
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded-full text-[11px] font-bold shadow-xl animate-bounce ${type==='success' ? 'bg-green-500 text-black' : 'bg-white/10 text-white'}`;
            t.innerText = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function switchTab(t) {
            ['basic', 'special', 'numbers', 'history'].forEach(p => {
                document.getElementById(`pane-${p}`).classList.add('hidden');
                document.getElementById(`tab-${p}`).classList.remove('tab-active');
                document.getElementById(`tab-${p}`).classList.add('text-slate-500');
            });
            document.getElementById(`pane-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('tab-active');
            document.getElementById(`tab-${t}`).classList.remove('text-slate-500');
            if(t === 'history') loadHistory();
        }

        function toggleBet(el, type) {
            if(selectedBets.has(type)) {
                selectedBets.delete(type);
                el.classList.remove('active');
            } else {
                selectedBets.add(type);
                el.classList.add('active');
            }
            document.getElementById('selected-count').innerText = selectedBets.size;
        }

        async function submitBets() {
            const amount = document.getElementById('bet-amount').value;
            if (selectedBets.size === 0) return showToast('选择玩法');
            if (!amount || amount < 2) return showToast('最小 2 元');

            const bets = Array.from(selectedBets).map(t => ({ play_type: t, amount: parseFloat(amount) }));
            try {
                const res = await fetch('/api/bet.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bets, odds_type: oddsMode, issue_no: currentIssue })
                });
                const data = await res.json();
                if(data.success) {
                    showToast('下单成功', 'success');
                    selectedBets.clear();
                    document.querySelectorAll('.bet-item').forEach(i => i.classList.remove('active'));
                    document.getElementById('selected-count').innerText = 0;
                } else showToast(data.message);
            } catch (e) { showToast('网络错误'); }
        }

        async function refreshData() {
            try {
                const res = await fetch('/api/lottery.php');
                const data = await res.json();
                if(data.latest) {
                    currentIssue = data.latest.issue_no;
                    document.getElementById('issue-display').innerText = `第 ${currentIssue} 期正在下注`;
                    const nums = data.latest.numbers.split(',');
                    const balls = document.querySelectorAll('.num-ball');
                    balls[0].innerText = nums[0];
                    balls[1].innerText = nums[1];
                    balls[2].innerText = nums[2];
                    document.getElementById('total-result').innerText = data.latest.total_sum;

                    if(lastLotteryId !== currentIssue) {
                        lastLotteryId = currentIssue;
                        document.querySelector('.mipai-container').classList.remove('revealed');
                    }
                }

                const feedRes = await fetch('/api/live_bets.php');
                const feedData = await feedRes.json();
                if(feedData.data && feedData.data.length > 0) {
                    const container = document.getElementById('live-feed-container');
                    container.innerHTML = feedData.data.slice(0, 10).map(b => `
                        <div class="text-[10px] text-primary/60 py-1 truncate">
                            用户 ${b.username.substring(0,3)}*** 下注 ${b.play_type} ¥${Math.floor(b.bet_amount)}
                        </div>
                    `).join('');
                }
            } catch(e) {}
        }

        async function loadHistory() {
            const res = await fetch('/api/lottery.php?limit=20');
            const data = await res.json();
            if(data.history) {
                document.getElementById('pane-history').innerHTML = data.history.map(h => `
                    <div class="flex justify-between items-center p-3 bg-dark-light rounded-xl border border-white/5">
                        <span class="text-[10px] text-slate-500 font-bold">${h.issue_no}</span>
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-black text-primary">${h.total_sum}</span>
                            <span class="text-[9px] px-2 py-0.5 bg-white/5 rounded text-slate-400 font-bold">${h.numbers}</span>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function quickCheckScore() {
            const res = await fetch('/api/quick_finance.php?action=check');
            const data = await res.json();
            if(data.success) showToast(`当前分数: ¥${parseFloat(data.balance).toLocaleString()}`, 'success');
        }

        function openReturnModal() { document.getElementById('return-modal').classList.remove('hidden'); }
        function closeReturnModal() { document.getElementById('return-modal').classList.add('hidden'); }

        async function submitScoreReturn() {
            const amount = document.getElementById('return-amount').value;
            if(!amount || amount < 10) return showToast('最小 10');
            const res = await fetch('/api/quick_finance.php?action=return', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({amount: parseFloat(amount)})
            });
            const data = await res.json();
            showToast(data.message, data.success ? 'success' : 'info');
            if(data.success) closeReturnModal();
        }

        setInterval(refreshData, 5000);
        refreshData();
    </script>
</body>
</html>
