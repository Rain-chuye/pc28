<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 加拿大 28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#D4AF37',
                        gold: { DEFAULT: '#D4AF37' },
                        dark: { DEFAULT: '#121212', light: '#1E1E1E', lighter: '#2A2A2A' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        body { font-family: 'Noto+Sans+SC', sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #F9E79F 0%, #D4AF37 50%, #9A7D0A 100%); }
    </style>
</head>
<body class="bg-dark text-white pb-32">
    <!-- Header -->
    <header class="p-8 pb-16 rounded-b-[4rem] bg-dark-light border-b border-white/5 relative overflow-hidden">
        <div class="relative z-10 flex justify-between items-center mb-10">
            <button onclick="history.back()" class="w-10 h-10 rounded-full bg-dark flex items-center justify-center border border-white/10"><i class="fas fa-chevron-left"></i></button>
            <h1 class="font-black text-sm uppercase tracking-[0.3em]">个人中心</h1>
            <button onclick="location.href='/api/logout.php'" class="w-10 h-10 rounded-full bg-dark flex items-center justify-center border border-white/10 text-red-400"><i class="fas fa-power-off"></i></button>
        </div>
        <div class="relative z-10 flex items-center gap-6">
            <div class="w-20 h-20 gold-gradient rounded-3xl flex items-center justify-center text-3xl font-black text-black shadow-2xl shadow-primary/20">
                <span id="user-initial">U</span>
            </div>
            <div>
                <h2 class="text-2xl font-black" id="username-display">加载中...</h2>
                <div class="flex items-center gap-2 mt-2">
                    <span class="text-[10px] bg-primary/10 text-primary px-3 py-1 rounded-full font-black uppercase tracking-widest">至尊会员</span>
                    <span class="text-[10px] text-slate-500 font-bold">UID: <span id="user-id">0000</span></span>
                </div>
            </div>
        </div>
        <i class="fas fa-crown absolute -right-8 -bottom-8 text-[12rem] text-white/5 rotate-12"></i>
    </header>

    <div class="px-6 -mt-10 space-y-6 relative z-20">
        <!-- Balance Card -->
        <div class="bg-dark-light rounded-[2.5rem] p-8 border border-white/10 shadow-2xl flex justify-between items-center">
            <div>
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">当前可用余额</p>
                <h3 class="text-4xl font-black text-primary">¥ <span id="balance">0.00</span></h3>
            </div>
            <div class="flex gap-2">
                <button onclick="location.href='/recharge.html'" class="w-12 h-12 bg-dark rounded-2xl flex items-center justify-center border border-white/5 text-primary">
                    <i class="fas fa-plus"></i>
                </button>
                <button onclick="location.href='/wallet_logs.html'" class="w-12 h-12 bg-dark rounded-2xl flex items-center justify-center border border-white/5 text-slate-400">
                    <i class="fas fa-receipt"></i>
                </button>
            </div>
        </div>

        <!-- Quick Stats Summary -->
        <div class="grid grid-cols-2 gap-4">
             <div onclick="location.href='/stats.html'" class="bg-dark-light p-6 rounded-[2rem] border border-white/10 active:scale-95 transition-transform">
                <p class="text-[9px] text-slate-500 font-black uppercase mb-1">财富报表</p>
                <div class="flex items-center gap-2">
                    <i class="fas fa-chart-pie text-primary text-xs"></i>
                    <span class="text-xs font-black">查看明细</span>
                </div>
            </div>
            <div onclick="location.href='/wallet_logs.html'" class="bg-dark-light p-6 rounded-[2rem] border border-white/10 active:scale-95 transition-transform">
                <p class="text-[9px] text-slate-500 font-black uppercase mb-1">积分变动</p>
                <div class="flex items-center gap-2">
                    <i class="fas fa-history text-slate-400 text-xs"></i>
                    <span class="text-xs font-black">变动记录</span>
                </div>
            </div>
        </div>

        <!-- Menu -->
        <div class="bg-dark-light rounded-[2.5rem] border border-white/10 overflow-hidden">
            <a href="/withdraw.html" class="p-6 border-b border-white/5 flex items-center justify-between active:bg-dark transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-dark rounded-xl flex items-center justify-center text-slate-500 border border-white/5"><i class="fas fa-university"></i></div>
                    <span class="text-sm font-black">申请提现</span>
                </div>
                <i class="fas fa-chevron-right text-slate-800"></i>
            </a>
            <div class="p-6 flex items-center justify-between active:bg-dark transition-colors" onclick="location.href='/wallet_logs.html?type=bet'">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-dark rounded-xl flex items-center justify-center text-slate-500 border border-white/5"><i class="fas fa-history"></i></div>
                    <span class="text-sm font-black">投注明细</span>
                </div>
                <i class="fas fa-chevron-right text-slate-800"></i>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 p-4 bg-dark/80 backdrop-blur-xl border-t border-white/5 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="/" class="flex flex-col items-center gap-1 text-slate-500">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px] font-bold">大厅</span>
            </a>
            <a href="/recharge.html" class="flex flex-col items-center gap-1 text-slate-500">
                <i class="fas fa-plus-circle text-lg"></i>
                <span class="text-[10px] font-bold">充值</span>
            </a>
            <a href="/withdraw.html" class="flex flex-col items-center gap-1 text-slate-500">
                <i class="fas fa-university text-lg"></i>
                <span class="text-[10px] font-bold">提现</span>
            </a>
            <a href="/profile.html" class="flex flex-col items-center gap-1 text-primary">
                <i class="fas fa-user text-lg"></i>
                <span class="text-[10px] font-bold">我的</span>
            </a>
        </div>
    </nav>

    <script>
        async function loadProfile() {
            const res = await fetch('/api/user_info.php');
            const data = await res.json();
            if(data.success) {
                const u = data.user;
                document.getElementById('username-display').innerText = u.username;
                document.getElementById('user-initial').innerText = u.username[0].toUpperCase();
                document.getElementById('user-id').innerText = String(u.id).padStart(4, '0');
                document.getElementById('balance').innerText = parseFloat(u.balance).toLocaleString();
            } else {
                location.href = '/login.html';
            }
        }
        loadProfile();
    </script>
</body>
</html>
